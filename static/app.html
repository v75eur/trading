<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rick Trading - Plateforme</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column}
.header{background:#161b22;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-wrap:wrap;gap:10px}
.logo{font-size:1.3rem;font-weight:600;color:#58a6ff}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls select,.controls button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:5px 10px;border-radius:6px;cursor:pointer}
.price-live{font-weight:bold;color:#3fb950;min-width:90px}
.main-layout{display:flex;flex:1;overflow:hidden}
.chart-area{flex:1;display:flex;flex-direction:column}
#chart{width:100%;flex:1;background:#0d1117}
.chart-info{background:#161b22;padding:6px 15px;display:flex;gap:20px;font-size:0.75rem;border-top:1px solid #30363d;flex-wrap:wrap}
.chart-info span{background:#0d1117;padding:3px 10px;border-radius:20px}
.chat-panel{width:320px;background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column}
.chat-header{background:#21262d;padding:10px;text-align:center;font-weight:bold;color:#58a6ff}
.chat-messages{flex:1;overflow-y:auto;padding:10px}
.chat-msg{background:#0d1117;padding:6px 10px;margin:5px 0;border-radius:10px;font-size:0.85rem}
.chat-user{font-weight:bold;margin-right:6px}
.chat-time{color:#666;font-size:0.7rem;margin-left:6px}
.chat-input-area{padding:10px;border-top:1px solid #30363d}
.chat-input-area input{width:100%;background:#0d1117;border:1px solid #30363d;padding:8px;border-radius:25px;color:white;margin-bottom:6px}
.chat-input-area button{width:100%;background:#58a6ff;color:#0d1117;border:none;padding:6px;border-radius:25px;font-weight:bold;cursor:pointer}
@media(max-width:700px){.chat-panel{width:280px}}
</style>
</head>
<body>
<div class="header">
    <div class="logo">📈 Rick Trading</div>
    <div class="controls">
        <a href="/" style="color:#f0a93e;text-decoration:none">🏠 Accueil</a>
        <select id="sym" onchange="changeSymbol()"><option value="R_75">Volatility 75</option><option value="frxEURUSD">EUR/USD</option><option value="frxXAUUSD">XAU/USD</option></select>
        <select id="tf" onchange="changeTF()"><option value="5">M5</option><option value="15">M15</option><option value="60">H1</option><option value="240">H4</option></select>
        <span class="price-live" id="price">---</span>
        <button onclick="zoomIn()">+</button><button onclick="zoomOut()">-</button><button onclick="resetZoom()">↺</button>
    </div>
</div>
<div class="main-layout">
    <div class="chart-area">
        <canvas id="chart"></canvas>
        <div class="chart-info">
            <span>Canal: <span id="canalVal">--</span></span>
            <span>S/R: <span id="srVal">--</span></span>
            <span>Signal: <span id="signalVal">--</span></span>
            <span>Stats: <span id="statsVal">--</span></span>
        </div>
    </div>
    <div class="chat-panel">
        <div class="chat-header">💬 Chat communautaire</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Votre message..." onkeypress="if(event.key==='Enter')sendChat()">
            <button onclick="sendChat()">Envoyer</button>
        </div>
    </div>
</div>
<script src="/static/chart.js"></script>
<script>
    const API_URL = 'https://trading-api.onrender.com';
    let USERNAME = localStorage.getItem('rick_pseudo') || '';
    if(!USERNAME){USERNAME=prompt('Votre pseudo:');if(USERNAME)localStorage.setItem('rick_pseudo',USERNAME)}
    function getColor(n){let c=['#58a6ff','#3fb950','#f0883e','#a371f7','#f85149','#d29922'],h=0;for(let i=0;i<n.length;i++)h=((h<<5)-h)+n.charCodeAt(i);return c[Math.abs(h)%c.length]}
    async function loadChat(){try{const r=await fetch(API_URL+'/api/chat'),m=await r.json();const c=document.getElementById('chatMessages');c.innerHTML=m.map(x=>`<div class="chat-msg"><span class="chat-user" style="color:${getColor(x.pseudo)}">${x.pseudo}</span> ${x.message}<span class="chat-time">${x.time}</span></div>`).join('');c.scrollTop=c.scrollHeight}catch(e){}}
    async function sendChat(){const i=document.getElementById('chatInput');const m=i.value.trim();if(!m||!USERNAME)return;await fetch(API_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pseudo:USERNAME,message:m})});i.value='';loadChat()}
    loadChat();setInterval(loadChat,4000);
</script>
</body>
</html>
