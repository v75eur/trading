<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            height: 100%;
            overflow-y: auto;
        }

        /* Petit scroll élégant si nécessaire */
        body::-webkit-scrollbar {
            width: 4px;
        }
        body::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        body::-webkit-scrollbar-thumb {
            background: #f59e0b;
            border-radius: 4px;
        }

        /* Image de fond fixe */
        .hero-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
            z-index: 0;
        }

        /* Contenu principal - tout visible sans scroll */
        .content {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            width: 90%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: auto;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 0.7rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(245,158,11,0.4);
        }

        /* Badge en ligne */
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(8px);
            padding: 5px 15px;
            border-radius: 50px;
            margin-bottom: 1rem;
            border: 1px solid #3fb950;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 6px #3fb950;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        /* 3 fonctionnalités en ligne */
        .features-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .feature-chip {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }

        .feature-chip:hover {
            transform: translateY(-2px);
            border-color: #f59e0b;
            background: rgba(245,158,11,0.1);
        }

        .feature-chip span {
            font-size: 1rem;
            margin-right: 6px;
        }

        .feature-chip h3 {
            font-size: 0.85rem;
            font-weight: 500;
            display: inline;
            color: #c9d1d9;
        }

        /* Deux cartes côte à côte */
        .cards-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .info-card {
            flex: 1;
            min-width: 220px;
            max-width: 260px;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-4px);
            border-color: #f59e0b;
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.4);
        }

        .card-header {
            background: rgba(22, 27, 34, 0.7);
            padding: 0.6rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-weight: 600;
            color: #f59e0b;
            font-size: 0.8rem;
        }

        .card-body {
            padding: 0.8rem;
            text-align: center;
        }

        .card-body img {
            max-width: 100%;
            border-radius: 14px;
            background: #0a0a0a;
            max-height: 110px;
            object-fit: cover;
        }

        .update-time {
            font-size: 0.6rem;
            color: #8b949e;
            margin-top: 0.4rem;
        }

        .empty-card-content {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            color: #8b949e;
            flex-direction: column;
            gap: 0.5rem;
        }

        .empty-card-content .emoji-big {
            font-size: 2rem;
        }

        /* Sélecteur de langue */
        .language-selector {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #f59e0b;
            border-radius: 30px;
            padding: 0.3rem 0.7rem;
            color: #f59e0b;
            cursor: pointer;
            z-index: 100;
            font-size: 0.75rem;
        }

        .language-selector:hover {
            background: #f59e0b;
            color: #0a0a0a;
        }

        footer {
            margin-top: 0.8rem;
            color: #64748b;
            font-size: 0.6rem;
            text-align: center;
        }

        @media (max-width: 700px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 0.8rem; }
            .feature-chip { padding: 0.3rem 1rem; }
            .cards-row { flex-direction: column; align-items: center; }
            .info-card { max-width: 100%; width: 100%; }
            .content { width: 95%; padding: 10px; }
        }
    </style>
</head>
<body>
    <img src="/static/rick.jpeg" alt="Rick Trading" class="hero-image">
    <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
        <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
        <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
        <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
    </select>

    <div class="content">
        <h1 id="title"></h1>
        <p id="subtitle" class="subtitle"></p>
        
        <div class="online-badge">
            <span class="online-dot"></span>
            <span id="onlineCount" style="font-weight:bold;">0</span>
            <span id="onlineLabel"></span>
        </div>
        
        <a href="/app" id="launchBtn" class="btn-primary"></a>

        <div class="features-row">
            <div class="feature-chip">
                <span>📈</span>
                <h3 id="feature1"></h3>
            </div>
            <div class="feature-chip">
                <span>🔔</span>
                <h3 id="feature2"></h3>
            </div>
            <div class="feature-chip">
                <span>💬</span>
                <h3 id="feature3"></h3>
            </div>
        </div>

        <div class="cards-row">
            <div class="info-card">
                <div class="card-header"><span id="marketPreview"></span></div>
                <div class="card-body">
                    <img id="chartPreview" src="" alt="Graphique">
                    <div class="update-time" id="chartUpdateTime"></div>
                </div>
            </div>
            <div class="info-card">
                <div class="card-header"><span id="partnerSpace"></span></div>
                <div class="card-body empty-card-content">
                    <div class="emoji-big">⚡</div>
                    <div>Contenu à venir</div>
                </div>
            </div>
        </div>
        
        <footer><p id="footer"></p></footer>
    </div>

    <script>
        function updatePage() {
            document.getElementById('title').textContent = t('title');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('launchBtn').innerHTML = t('launch');
            document.getElementById('feature1').textContent = t('feature1');
            document.getElementById('feature2').textContent = t('feature2');
            document.getElementById('feature3').textContent = t('feature3');
            document.getElementById('footer').innerHTML = t('footer');
            document.getElementById('marketPreview').textContent = t('market_preview');
            document.getElementById('partnerSpace').textContent = t('partner_space');
            document.getElementById('onlineLabel').textContent = t('online');
            document.getElementById('languageSelect').value = getCurrentLanguage();
        }

        function changeLanguage() {
            setLanguage(document.getElementById('languageSelect').value);
        }

        async function updateOnlineCount() {
            try {
                const res = await fetch('/api/online-display');
                const data = await res.json();
                document.getElementById('onlineCount').innerText = data.online;
            } catch(e) {}
        }

        async function updateChartPreview() {
            try {
                const res = await fetch('/api/chart-screenshot');
                const data = await res.json();
                const img = document.getElementById('chartPreview');
                if (img && data.image_url) {
                    img.src = data.image_url + '?t=' + new Date().getTime();
                    document.getElementById('chartUpdateTime').innerHTML = '🕒 ' + data.updated_at;
                }
            } catch(e) {}
        }

        updatePage();
        updateOnlineCount();
        updateChartPreview();
        setInterval(updateOnlineCount, 35000);
        setInterval(updateChartPreview, 600000);
    </script>
</body>
</html>
