<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }
        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.2;
            z-index: 0;
        }
        .content { position: relative; z-index: 1; max-width: 1200px; width: 100%; }
        h1 { font-size: 4rem; font-weight: 800; margin-bottom: 1.5rem; background: linear-gradient(135deg, #fff, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .subtitle { font-size: 1.25rem; color: #94a3b8; margin-bottom: 2rem; }
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.3s;
            margin: 0.5rem;
        }
        .btn-primary:hover { transform: scale(1.05); }
        .language-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a2e;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 0.5rem;
            color: #f59e0b;
            cursor: pointer;
            z-index: 100;
        }
        .features {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 3rem;
        }
        .feature {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 20px;
            width: 200px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        footer { margin-top: 4rem; color: #64748b; font-size: 0.8rem; }
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1a1a2e;
            padding: 8px 20px;
            border-radius: 50px;
            margin-top: 20px;
            border: 1px solid #3fb950;
        }
        .online-dot {
            width: 10px;
            height: 10px;
            background: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 6px #3fb950;
        }
        /* Styles pour les deux cadres */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            margin: 3rem 0;
        }
        .card {
            flex: 1;
            min-width: 280px;
            background: #0d1117;
            border-radius: 20px;
            border: 1px solid #30363d;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-3px); border-color: #f59e0b; }
        .card-header {
            background: #161b22;
            padding: 0.75rem;
            text-align: center;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
            color: #f59e0b;
        }
        .card-body {
            padding: 1.5rem;
            text-align: center;
        }
        .card-body img {
            max-width: 100%;
            border-radius: 12px;
            background: #0a0a0a;
        }
        .update-time {
            font-size: 0.7rem;
            color: #8b949e;
            margin-top: 0.5rem;
        }
        .empty-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: #8b949e;
            text-align: center;
            flex-direction: column;
            gap: 1rem;
        }
        @media (max-width: 768px) { 
            h1 { font-size: 2rem; } 
            .features { flex-direction: column; align-items: center; }
            .cards-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <img src="/static/rick.jpeg" alt="Rick Trading" class="hero-image">
    <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="pt">🇵🇹 Português</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
    </select>

    <div class="content">
        <h1 id="title"></h1>
        <p id="subtitle" class="subtitle"></p>
        
        <div class="online-badge">
            <span class="online-dot"></span>
            <span id="onlineCount" style="font-weight:bold;">0</span>
            <span id="onlineLabel">personnes en ligne</span>
        </div>
        
        <div>
            <a href="/app" id="launchBtn" class="btn-primary"></a>
        </div>
        
        <div class="features">
            <div class="feature"><div class="feature-icon">📈</div><div id="feature1"></div></div>
            <div class="feature"><div class="feature-icon">🔔</div><div id="feature2"></div></div>
            <div class="feature"><div class="feature-icon">💬</div><div id="feature3"></div></div>
        </div>

        <!-- DEUX CADRES : Image du graphique + Espace publicitaire -->
        <div class="cards-container">
            <!-- Cadre 1 : Capture automatique du graphique -->
            <div class="card">
                <div class="card-header">
                    📸 Aperçu du marché (actualisé toutes les heures)
                </div>
                <div class="card-body">
                    <img id="chartPreview" src="" alt="Graphique en cours">
                    <div class="update-time" id="chartUpdateTime"></div>
                </div>
            </div>

            <!-- Cadre 2 : Espace libre (pub, lien, message) -->
            <div class="card">
                <div class="card-header">
                    🎯 Espace partenaire
                </div>
                <div class="card-body empty-card">
                    <div>⚡</div>
                    <div>Contenu à venir<br>(publicité, actualité, lien…)</div>
                </div>
            </div>
        </div>
        
        <footer><p id="footer"></p></footer>
    </div>

    <script>
        function updatePage() {
            document.getElementById('title').textContent = t('title');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('launchBtn').innerHTML = t('launch');
            document.getElementById('feature1').textContent = t('feature1');
            document.getElementById('feature2').textContent = t('feature2');
            document.getElementById('feature3').textContent = t('feature3');
            document.getElementById('footer').textContent = t('footer');
            document.getElementById('languageSelect').value = getCurrentLanguage();
            document.getElementById('onlineLabel').textContent = t('online') + ' en ligne';
        }

        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            setLanguage(lang);
        }

        async function updateOnlineCount() {
            try {
                const res = await fetch('/api/online-display');
                const data = await res.json();
                document.getElementById('onlineCount').innerText = data.online;
            } catch(e) {}
        }

        async function updateChartPreview() {
            try {
                const res = await fetch('/api/chart-screenshot');
                const data = await res.json();
                const img = document.getElementById('chartPreview');
                if (img && data.image_url) {
                    img.src = data.image_url + '?t=' + new Date().getTime();
                    document.getElementById('chartUpdateTime').innerHTML = '🕒 ' + data.updated_at;
                }
            } catch(e) {}
        }

        updatePage();
        updateOnlineCount();
        updateChartPreview();
        setInterval(updateOnlineCount, 30000);
        setInterval(updateChartPreview, 3600000);
    </script>
</body>
</html>
