<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #ffffff; min-height: 100vh; overflow-x: hidden; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle at 20% 50%, #1a1a2e 0%, #0a0a0a 100%); overflow: hidden; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.12; z-index: 0; }
        .container { position: relative; z-index: 2; max-width: 1200px; width: 90%; margin: 0 auto; text-align: center; padding: 1rem; animation: fadeInUp 0.7s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .main-title { font-size: 3.8rem; font-weight: 900; margin-bottom: 1rem; background: linear-gradient(135deg, #ffffff 0%, #f59e0b 40%, #ffedd5 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .subtitle { font-size: 1.05rem; color: #94a3b8; margin-bottom: 1.8rem; max-width: 550px; margin-left: auto; margin-right: auto; }
        .online-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(26,26,46,0.5); backdrop-filter: blur(8px); padding: 6px 20px; border-radius: 60px; margin-bottom: 1.8rem; border: 1px solid rgba(63,185,80,0.4); }
        .online-dot { width: 10px; height: 10px; background: #3fb950; border-radius: 50%; box-shadow: 0 0 6px #3fb950; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } }
        .btn-primary { display: inline-block; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 12px 36px; font-size: 1rem; font-weight: 700; border-radius: 60px; text-decoration: none; margin-bottom: 2rem; transition: all 0.2s; box-shadow: 0 4px 15px rgba(245,158,11,0.25); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,158,11,0.35); }
        .features-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .feature-pill { background: rgba(255,255,255,0.03); backdrop-filter: blur(8px); padding: 0.5rem 1.2rem; border-radius: 40px; border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s; }
        .feature-pill:hover { transform: translateY(-2px); border-color: #f59e0b; background: rgba(245,158,11,0.1); }
        .feature-icon { font-size: 1rem; margin-right: 6px; }
        .cards-row { display: flex; flex-wrap: wrap; gap: 1.2rem; justify-content: center; max-width: 750px; margin: 0 auto; }
        .card { flex: 1; min-width: 240px; max-width: 280px; background: rgba(13,17,23,0.6); backdrop-filter: blur(10px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.06); overflow: hidden; transition: all 0.25s; }
        .card:hover { transform: translateY(-5px); border-color: #f59e0b; }
        .card-header { background: rgba(22,27,34,0.7); padding: 0.7rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06); font-weight: 700; color: #f59e0b; font-size: 0.85rem; }
        .card-body { padding: 0.9rem; text-align: center; }
        .card-body img { max-width: 100%; border-radius: 16px; max-height: 130px; object-fit: cover; }
        .update-time { font-size: 0.6rem; color: #8b949e; margin-top: 0.4rem; }
        .empty-card { display: flex; align-items: center; justify-content: center; min-height: 130px; flex-direction: column; gap: 0.4rem; }
        .empty-card .emoji { font-size: 2rem; }
        .language-selector { position: fixed; top: 16px; right: 16px; background: rgba(30,41,59,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(245,158,11,0.5); border-radius: 40px; padding: 5px 12px; color: #f59e0b; cursor: pointer; z-index: 100; font-size: 0.75rem; }
        .language-selector:hover { background: #f59e0b; color: #0a0a0a; }
        footer { margin-top: 1.5rem; color: #64748b; font-size: 0.65rem; text-align: center; padding: 0.8rem; }
        /* Bandeau urgence */
        .urgent-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #f85149, #d32f2f);
            color: white;
            padding: 8px 40px 8px 16px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            z-index: 1001;
            backdrop-filter: blur(8px);
            animation: blinkWarning 1.2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        @keyframes blinkWarning { 0%,100% { background: linear-gradient(135deg, #f85149, #d32f2f); opacity: 1; } 50% { background: linear-gradient(135deg, #d32f2f, #b71c1c); opacity: 0.95; } }
        .urgent-icon { font-size: 1rem; animation: shake 0.5s ease-in-out infinite; }
        @keyframes shake { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
        .urgent-close { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.3); border: none; color: white; font-size: 0.9rem; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .urgent-close:hover { background: rgba(0,0,0,0.5); }
        @media (max-width: 700px) { .main-title { font-size: 2.2rem; } .cards-row { flex-direction: column; align-items: center; } .card { max-width: 100%; } .urgent-banner { font-size: 0.65rem; padding: 6px 35px 6px 12px; } }
    </style>
</head>
<body>
    <!-- Bandeau urgence avec traduction -->
    <div class="urgent-banner" id="urgentBanner">
        <span class="urgent-icon">⚠️</span>
        <span class="urgent-text" id="urgentMessage"></span>
        <button class="urgent-close" onclick="closeUrgentBanner()">✕</button>
    </div>

    <img src="/static/rick.jpeg" alt="Rick Trading" class="hero-bg">
    <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
        <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
        <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
        <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
    </select>

    <div class="hero">
        <div class="container">
            <h1 class="main-title" id="title"></h1>
            <p class="subtitle" id="subtitle"></p>
            <div class="online-badge">
                <span class="online-dot"></span>
                <span id="onlineCount" style="font-weight:700;">0</span>
                <span id="onlineLabel"></span>
            </div>
            <a href="/app" id="launchBtn" class="btn-primary"></a>
            <div class="features-row">
                <div class="feature-pill"><span class="feature-icon">📈</span><span id="feature1"></span></div>
                <div class="feature-pill"><span class="feature-icon">🔔</span><span id="feature2"></span></div>
                <div class="feature-pill"><span class="feature-icon">💬</span><span id="feature3"></span></div>
            </div>
            <div class="cards-row">
                <div class="card">
                    <div class="card-header"><span id="marketPreview"></span></div>
                    <div class="card-body">
                        <img id="chartPreview" src="" alt="Graphique">
                        <div class="update-time" id="chartUpdateTime"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><span id="partnerSpace"></span></div>
                    <div class="card-body empty-card">
                        <div class="emoji">⚡</div>
                        <div>À venir</div>
                    </div>
                </div>
            </div>
            <footer><p id="footer"></p></footer>
        </div>
    </div>

    <script>
        // Traductions du message d'urgence
        const urgentMessages = {
            fr: "⚠️ Conseil mobile : activez le mode PC / bureau dans votre navigateur (Chrome : ⋮ → « Site Web pour ordinateur »).",
            en: "⚠️ Mobile tip: enable Desktop mode in your browser (Chrome: ⋮ → 'Desktop site').",
            es: "⚠️ Consejo móvil: active el modo PC / escritorio en su navegador (Chrome: ⋮ → 'Sitio web para ordenador').",
            pt: "⚠️ Dica móvel: ative o modo PC / desktop no seu navegador (Chrome: ⋮ → 'Site para computador').",
            ru: "⚠️ Мобильный совет: включите режим ПК / рабочего стола в браузере (Chrome: ⋮ → «Компьютерная версия сайта»).",
            it: "⚠️ Consiglio mobile: attiva la modalità PC / desktop nel tuo browser (Chrome: ⋮ → 'Sito per computer').",
            de: "⚠️ Mobil-Tipp: aktivieren Sie den PC- / Desktop-Modus in Ihrem Browser (Chrome: ⋮ → 'Computerwebsite').",
            zh: "⚠️ 移动提示：在浏览器中启用PC /桌面模式（Chrome：⋮→“电脑版网站”）。",
            ja: "⚠️ モバイルヒント：ブラウザでPC /デスクトップモードを有効にしてください（Chrome：⋮→「コンピューターサイト」）。"
        };

        function updateUrgentMessage() {
            const lang = getCurrentLanguage();
            const msg = urgentMessages[lang] || urgentMessages.fr;
            const msgElement = document.getElementById('urgentMessage');
            if (msgElement) msgElement.textContent = msg;
        }

        function closeUrgentBanner() {
            document.getElementById('urgentBanner').style.display = 'none';
            localStorage.setItem('urgentClosed', 'true');
        }

        function checkUrgentBanner() {
            if (localStorage.getItem('urgentClosed') === 'true') {
                document.getElementById('urgentBanner').style.display = 'none';
            }
        }

        function updatePage() {
            document.getElementById('title').textContent = t('title');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('launchBtn').innerHTML = t('launch');
            document.getElementById('feature1').textContent = t('feature1');
            document.getElementById('feature2').textContent = t('feature2');
            document.getElementById('feature3').textContent = t('feature3');
            document.getElementById('footer').innerHTML = t('footer');
            document.getElementById('marketPreview').textContent = t('market_preview');
            document.getElementById('partnerSpace').textContent = t('partner_space');
            document.getElementById('onlineLabel').textContent = t('online');
            document.getElementById('languageSelect').value = getCurrentLanguage();
            updateUrgentMessage();
        }

        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            setLanguage(lang);
            setTimeout(() => updateUrgentMessage(), 50);
        }

        async function updateOnlineCount() {
            try {
                const res = await fetch('/api/online-display');
                const data = await res.json();
                document.getElementById('onlineCount').innerText = data.online;
            } catch(e) {}
        }

        async function updateChartPreview() {
            try {
                const res = await fetch('/api/chart-screenshot');
                const data = await res.json();
                const img = document.getElementById('chartPreview');
                if (img && data.image_url) {
                    img.src = data.image_url + '?t=' + new Date().getTime();
                    document.getElementById('chartUpdateTime').innerHTML = '🕒 ' + data.updated_at;
                }
            } catch(e) {}
        }

        updatePage();
        updateOnlineCount();
        updateChartPreview();
        checkUrgentBanner();
        setInterval(updateOnlineCount, 35000);
        setInterval(updateChartPreview, 600000);
    </script>
</body>
</html>
