<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rick Trading</title>
<script src="/static/translations.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;display:flex;height:100vh}
.left{flex:1;display:flex;flex-direction:column;min-width:0}
.top{background:#161b22;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-wrap:wrap;gap:10px}
.top h1{color:#58a6ff;font-size:18px;font-weight:600}
.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrls select,.ctrls button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:all 0.2s}
.ctrls select:hover,.ctrls button:hover{background:#30363d;border-color:#58a6ff}
.live{font-weight:bold;color:#3fb950;font-size:14px;min-width:90px}
#chart{width:100%;flex:1;display:block}
.info{background:#161b22;padding:10px 20px;display:flex;gap:15px;flex-wrap:wrap;font-size:12px;border-top:1px solid #30363d}
.info span{background:#0d1117;padding:4px 12px;border-radius:20px}
.trend-bar{background:#161b22;padding:8px 20px;text-align:center;font-size:13px;border-top:1px solid #30363d}
#loader{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:998;display:none}
.spinner{width:45px;height:45px;border:3px solid #30363d;border-top:3px solid #58a6ff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chat-panel{width:350px;background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column;height:100vh}
.chat-header{background:#21262d;padding:12px;text-align:center;font-weight:bold;color:#58a6ff;font-size:14px;border-bottom:1px solid #30363d;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.chat-header .share-btns{display:flex;gap:6px}
.chat-header .share-btns button{background:rgba(88,166,255,0.1);border:none;color:#8b949e;cursor:pointer;font-size:14px;padding:4px 8px;border-radius:6px;transition:0.2s}
.chat-header .share-btns button:hover{background:#58a6ff20;color:#58a6ff}
.chat-messages{flex:1;overflow-y:auto;padding:12px;min-height:0}
.chat-msg{padding:8px 12px;margin:5px 0;background:#0d1117;border-radius:10px;font-size:14px;line-height:1.4}
.chat-msg .user{font-weight:bold;font-size:12px;display:inline;margin-right:6px}
.chat-msg .time{color:#666;font-size:10px;margin-left:6px}
.chat-input-area{padding:12px;border-top:1px solid #30363d;flex-shrink:0;background:#161b22}
.chat-input-area input{width:100%;background:#0d1117;color:white;border:1px solid #30363d;padding:10px 14px;border-radius:25px;font-size:14px;margin-bottom:8px;outline:none}
.chat-input-area input:focus{border-color:#58a6ff}
.chat-input-area button{width:100%;background:#58a6ff;color:#0d1117;border:none;padding:10px;border-radius:25px;cursor:pointer;font-size:14px;font-weight:bold;transition:0.2s}
.chat-input-area button:hover{background:#79c0ff}
.emoji-bar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
.emoji-bar button{background:#21262d;border:none;font-size:18px;cursor:pointer;padding:4px 6px;border-radius:8px}
.like-container{position:fixed;bottom:20px;right:370px;z-index:9999;display:flex;align-items:center;gap:10px}
.like-btn{background:rgba(22,27,34,0.95);border:2px solid #f85149;color:#f85149;font-size:20px;width:48px;height:48px;border-radius:50%;cursor:pointer;transition:0.2s}
.like-btn:hover{background:#f85149;color:white}
.like-count{background:rgba(22,27,34,0.95);color:white;padding:8px 16px;border-radius:30px;font-weight:bold;font-size:14px}
#adminTrigger{position:fixed;bottom:12px;left:12px;z-index:9999;width:28px;height:28px;border-radius:50%;background:rgba(22,27,34,0.8);color:#8b949e;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
#wsErrorBanner{position:fixed;top:0;left:0;width:100%;background:#f85149;color:white;text-align:center;padding:10px;z-index:10000;font-size:13px}
#tokenWarning{position:fixed;top:12px;right:12px;background:#d29922;color:#0a0a0a;padding:5px 12px;border-radius:30px;font-size:12px;z-index:10000}
.online-badge-small{display:flex;align-items:center;gap:6px;background:#1e293b;padding:5px 12px;border-radius:30px}
.online-dot-small{width:8px;height:8px;background:#3fb950;border-radius:50%;box-shadow:0 0 4px #3fb950}
</style>
</head>
<body>
<div id="wsErrorBanner" style="display:none;">⚠️ Serveur de données temporairement indisponible. Reconnexion...</div>
<div id="tokenWarning" style="display:none;">🔐 Token GitHub expire bientôt</div>

<div class="left">
<div class="top">
    <h1 id="appTitle"></h1>
    <div class="ctrls">
        <select id="sym"><option value="R_75">Volatility 75</option><option value="frxEURUSD">EUR/USD</option><option value="frxXAUUSD">XAU/USD</option></select>
        <select id="tf"><option value="5">M5</option><option value="60">H1</option></select>
        <span class="live" id="price">---</span>
        <button onclick="zoomIn()">+</button><button onclick="zoomOut()">-</button><button onclick="resetZoom()">↺</button>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
        <div class="online-badge-small"><span class="online-dot-small"></span><span id="onlineCount">0</span><span id="onlineLabel"></span></div>
        <select id="langSelect" onchange="changeAppLanguage(this.value)" style="background:#21262d;color:#f59e0b;border:1px solid #f59e0b;border-radius:6px;padding:5px 10px;">
            <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
            <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
            <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
        </select>
    </div>
</div>
<div id="loader"><div class="spinner"></div></div>
<canvas id="chart"></canvas>
<div class="trend-bar" id="trendGeneral">--</div>
<div class="info">
    <span id="canal"><span id="canalLabel"></span>: --</span>
    <span id="sr"><span id="srLabel"></span>: --</span>
    <span id="pat"><span id="signalsLabel"></span>: --</span>
    <span id="stats"><span id="statsLabel"></span>: --</span>
</div>
</div>

<div class="chat-panel">
    <div class="chat-header"><span id="chatTitle"></span><div class="share-btns"><button onclick="share('twitter')">𝕏</button><button onclick="share('facebook')">📘</button><button onclick="share('telegram')">📱</button></div></div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area"><div class="emoji-bar"><button onclick="addEmoji('🚀')">🚀</button><button onclick="addEmoji('📈')">📈</button><button onclick="addEmoji('📉')">📉</button><button onclick="addEmoji('💰')">💰</button><button onclick="addEmoji('🔥')">🔥</button></div>
    <input type="text" id="chatInput" onkeypress="if(event.key==='Enter')sendChat()" onclick="openPseudoIfNeeded()"><button id="sendBtn" onclick="sendChat()"></button></div>
</div>

<div id="pseudoModal"><div class="pseudo-box"><button onclick="closePseudoModal()">✕</button><h3 id="welcomeTitle"></h3><p id="pseudoText"></p><input type="text" id="pseudoInput" maxlength="20"><button id="joinBtn" onclick="setPseudo()"></button></div></div>

<div class="like-container"><div class="like-count" id="likeCount">112</div><button class="like-btn" id="likeBtn" onclick="addLike()">❤️</button></div>
<button id="adminTrigger" onclick="openAdmin()">⚙</button>

<script>
function updateAppLanguage(){const lang=getCurrentLanguage(),t=translations[lang];if(t){document.getElementById('appTitle').innerHTML=t.app_title;document.getElementById('canalLabel').innerHTML=t.canal;document.getElementById('srLabel').innerHTML=t.sr;document.getElementById('signalsLabel').innerHTML=t.signals;document.getElementById('statsLabel').innerHTML=t.stats;document.getElementById('chatTitle').innerHTML=t.chat_title;document.getElementById('chatInput').placeholder=t.chat_placeholder;document.getElementById('sendBtn').innerHTML=t.chat_send;document.getElementById('welcomeTitle').innerHTML='👋 '+t.chat_welcome;document.getElementById('pseudoText').innerHTML=t.chat_pseudo;document.getElementById('joinBtn').innerHTML=t.chat_join;document.getElementById('onlineLabel').innerHTML=t.online;}document.getElementById('langSelect').value=getCurrentLanguage();}
function changeAppLanguage(lang){setLanguage(lang);}
async function updateOnlineCount(){try{const res=await fetch('/api/online-display'),data=await res.json();document.getElementById('onlineCount').innerText=data.online;}catch(e){}}
var audioCtx=null;function playSound(f,t,d){try{if(!audioCtx)audioCtx=new AudioContext();var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.1;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d);}catch(e){}}
var USERNAME="",userColors={},colors=['#58a6ff','#3fb950','#f0883e','#a371f7','#f85149','#d29922'];function getColor(n){if(!userColors[n])userColors[n]=colors[Object.keys(userColors).length%colors.length];return userColors[n];}
fetch("/api/pseudo").then(r=>r.json()).then(d=>{USERNAME=d.pseudo;});
function openPseudoIfNeeded(){if(!USERNAME){document.getElementById('pseudoModal').style.display='flex';document.getElementById('pseudoInput').focus();}}
function closePseudoModal(){document.getElementById('pseudoModal').style.display='none';}
function setPseudo(){var n=document.getElementById('pseudoInput').value.trim();if(n.length<2)return;USERNAME=n;fetch("/api/pseudo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pseudo:n})});closePseudoModal();}
function addEmoji(e){document.getElementById('chatInput').value+=e;document.getElementById('chatInput').focus();}
function share(p){var u=encodeURIComponent('https://trading-ilfh.onrender.com'),t=encodeURIComponent('📊 Rejoignez-moi sur Rick Trading !'),l={twitter:'https://twitter.com/intent/tweet?text='+t+'&url='+u,facebook:'https://www.facebook.com/sharer/sharer.php?u='+u,telegram:'https://t.me/share/url?url='+u+'&text='+t};window.open(l[p],'_blank','width=600,height=400');}
var IS_ADMIN=false,_k=null;(async function(){var _d=new TextEncoder().encode('AlidaBerenice1994'),_h=await crypto.subtle.digest('SHA-256',_d);_k=Array.from(new Uint8Array(_h)).map(b=>b.toString(16).padStart(2,'0')).join('');})();
async function registerVisit(){await fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin:IS_ADMIN})});}
async function loadStats(){try{var r=await fetch('/api/stats'),d=await r.json();document.getElementById('likeCount').innerText=d.likes;}catch(e){}}
async function addLike(){try{var r=await fetch('/api/like',{method:'POST'}),d=await r.json();document.getElementById('likeCount').innerText=d.likes;if(d.status==='ok')document.getElementById('likeBtn').classList.add('liked');}catch(e){}}
function openAdmin(){document.getElementById('adminOverlay')?null:alert('Admin panel');}
var lastMsgCount=0;
async function loadChat(){try{var r=await fetch('/api/chat'),msgs=await r.json();if(msgs.length>lastMsgCount&&lastMsgCount>0)playSound(800,'sine',0.15);lastMsgCount=msgs.length;var el=document.getElementById('chatMessages');el.innerHTML=msgs.map(function(m){var u=m.user||'Anonyme',c=getColor(u);return'<div class="chat-msg"><span class="user" style="color:'+c+'">'+u+'</span>'+m.message+'<span class="time">'+m.time+'</span></div>';}).join('');el.scrollTop=el.scrollHeight;}catch(e){}}
async function sendChat(){if(!USERNAME){openPseudoIfNeeded();return;}var i=document.getElementById('chatInput'),m=i.value.trim();if(!m)return;await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,user:USERNAME})});i.value='';loadChat();}
updateOnlineCount();setInterval(updateOnlineCount,35000);loadChat();setInterval(loadChat,3000);registerVisit();loadStats();setInterval(loadStats,10000);updateAppLanguage();
</script>
<script src="/static/chart.js"></script>
</body>
</html>
