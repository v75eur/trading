<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Trading – Bientôt disponible</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .container { max-width: 500px; }
        .icon { font-size: 5rem; margin-bottom: 1.5rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
        h1 { font-size: 2rem; margin-bottom: 1rem; background: linear-gradient(135deg, #fbbf24, #f59e0b); background-clip: text; -webkit-background-clip: text; color: transparent; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        .btn { background: #f59e0b; color: #0a0a0a; padding: 0.7rem 1.8rem; border-radius: 2rem; text-decoration: none; font-weight: 700; display: inline-block; transition: 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>Fonctionnalité à venir</h1>
        <p>Cette fonctionnalité n'est pas encore disponible.<br>Elle arrivera très prochainement sur Rick Trading.</p>
        <a href="/" class="btn">🏠 Retour à l'accueil</a>
    </div>
</body>
</html>
