<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
            position: relative;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        }
        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
            z-index: 0;
            animation: slowZoom 20s ease-in-out infinite;
        }
        @keyframes slowZoom { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .hero-content { position: relative; z-index: 1; max-width: 1100px; width: 100%; animation: fadeInUp 0.8s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem; background: linear-gradient(135deg, #fff, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; animation: pulseGlow 3s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { text-shadow: 0 0 0px rgba(245,158,11,0); } 50% { text-shadow: 0 0 20px rgba(245,158,11,0.3); } }
        .subtitle { font-size: 1.1rem; color: #94a3b8; margin-bottom: 1.5rem; max-width: 600px; margin-left: auto; margin-right: auto; }
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(245,158,11,0.3);
            animation: bounceSoft 2s ease-in-out infinite;
        }
        @keyframes bounceSoft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(245,158,11,0.5); }
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 1.5rem;
            border: 1px solid #3fb950;
            animation: fadeInScale 0.6s ease-out 0.2s both;
        }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .online-dot { width: 10px; height: 10px; background: #3fb950; border-radius: 50%; box-shadow: 0 0 6px #3fb950; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .features-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; margin-bottom: 1.5rem; }
        .feature-item {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out both;
        }
        .feature-item:nth-child(1) { animation-delay: 0.1s; }
        .feature-item:nth-child(2) { animation-delay: 0.2s; }
        .feature-item:nth-child(3) { animation-delay: 0.3s; }
        .feature-item:hover { transform: translateY(-3px); border-color: #f59e0b; background: rgba(245,158,11,0.1); }
        .feature-icon { font-size: 1.3rem; margin-right: 8px; }
        .feature-item h3 { font-size: 0.9rem; font-weight: 500; display: inline; color: #c9d1d9; }
        .cards-row { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; margin-top: 0.5rem; }
        .info-card {
            flex: 1;
            min-width: 260px;
            max-width: 320px;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }
        .info-card:hover { transform: translateY(-5px); border-color: #f59e0b; box-shadow: 0 20px 30px -15px rgba(0,0,0,0.5); }
        .card-header {
            background: rgba(22, 27, 34, 0.8);
            padding: 0.8rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-weight: 600;
            color: #f59e0b;
            font-size: 0.9rem;
        }
        .card-body { padding: 1rem; text-align: center; }
        .card-body img { max-width: 100%; border-radius: 16px; background: #0a0a0a; transition: transform 0.4s ease; }
        .card-body img:hover { transform: scale(1.02); }
        .update-time { font-size: 0.65rem; color: #8b949e; margin-top: 0.5rem; }
        .empty-card-content { display: flex; align-items: center; justify-content: center; min-height: 160px; color: #8b949e; text-align: center; flex-direction: column; gap: 0.8rem; }
        .empty-card-content .emoji-big { font-size: 2.5rem; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .language-selector {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #f59e0b;
            border-radius: 30px;
            padding: 0.4rem 0.8rem;
            color: #f59e0b;
            cursor: pointer;
            z-index: 100;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .language-selector:hover { background: #f59e0b; color: #0a0a0a; }
        footer { margin-top: 1rem; color: #64748b; font-size: 0.7rem; text-align: center; padding: 0.5rem; animation: fadeInUp 0.6s ease-out 0.6s both; }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 0.9rem; }
            .feature-item { padding: 0.5rem 1rem; }
            .cards-row { flex-direction: column; align-items: center; }
            .info-card { max-width: 100%; }
        }
    </style>
</head>
<body>
    <img src="/static/rick.jpeg" alt="Rick Trading" class="hero-image">
    <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
        <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
        <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
        <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
    </select>

    <div class="hero">
        <div class="hero-content">
            <h1 id="title" class="animate-title"></h1>
            <p id="subtitle" class="subtitle"></p>
            
            <div class="online-badge">
                <span class="online-dot"></span>
                <span id="onlineCount" style="font-weight:bold;">0</span>
                <span id="onlineLabel"></span>
            </div>
            
            <a href="/app" id="launchBtn" class="btn-primary"></a>

            <div class="features-grid">
                <div class="feature-item">
                    <span class="feature-icon">📈</span>
                    <h3 id="feature1"></h3>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🔔</span>
                    <h3 id="feature2"></h3>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">💬</span>
                    <h3 id="feature3"></h3>
                </div>
            </div>

            <div class="cards-row">
                <div class="info-card">
                    <div class="card-header"><span id="marketPreview"></span></div>
                    <div class="card-body">
                        <img id="chartPreview" src="" alt="Graphique">
                        <div class="update-time" id="chartUpdateTime"></div>
                    </div>
                </div>
                <div class="info-card">
                    <div class="card-header"><span id="partnerSpace"></span></div>
                    <div class="card-body empty-card-content">
                        <div class="emoji-big">⚡</div>
                        <div id="partnerContent">Contenu à venir</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer><p id="footer"></p></footer>

    <script>
        function updatePage() {
            document.getElementById('title').textContent = t('title');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('launchBtn').innerHTML = t('launch');
            document.getElementById('feature1').textContent = t('feature1');
            document.getElementById('feature2').textContent = t('feature2');
            document.getElementById('feature3').textContent = t('feature3');
            document.getElementById('footer').innerHTML = t('footer');
            document.getElementById('marketPreview').textContent = t('market_preview');
            document.getElementById('partnerSpace').textContent = t('partner_space');
            document.getElementById('onlineLabel').textContent = t('online');
            document.getElementById('partnerContent').textContent = t('partner_content') || 'Contenu à venir';
            document.getElementById('languageSelect').value = getCurrentLanguage();
        }

        function changeLanguage() {
            setLanguage(document.getElementById('languageSelect').value);
        }

        async function updateOnlineCount() {
            try {
                const res = await fetch('/api/online-display');
                const data = await res.json();
                document.getElementById('onlineCount').innerText = data.online;
            } catch(e) {}
        }

        async function updateChartPreview() {
            try {
                const res = await fetch('/api/chart-screenshot');
                const data = await res.json();
                const img = document.getElementById('chartPreview');
                if (img && data.image_url) {
                    img.src = data.image_url + '?t=' + new Date().getTime();
                    document.getElementById('chartUpdateTime').innerHTML = '🕒 ' + data.updated_at;
                }
            } catch(e) {}
        }

        updatePage();
        updateOnlineCount();
        updateChartPreview();
        setInterval(updateOnlineCount, 35000);
        setInterval(updateChartPreview, 600000);
    </script>
</body>
</html>
<style>
.animate-title {
    animation: titleReveal 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}
@keyframes titleReveal {
    0% { letter-spacing: -0.5em; opacity: 0; transform: translateY(-30px); filter: blur(10px); }
    100% { letter-spacing: normal; opacity: 1; transform: translateY(0); filter: blur(0); }
}
</style>
