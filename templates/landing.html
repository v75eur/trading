<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root{
            --bg: #07090c;
            --bg-soft: #0d1117;
            --line: rgba(255,255,255,0.07);
            --ink: #e6edf3;
            --ink-dim: #8b949e;
            --amber: #f0a93e;
            --green: #3fb950;
            --red: #f85149;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Space Grotesk', sans-serif;
        }

        body {
            font-family: var(--display);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== TICKER SIGNATURE ===== */
        .ticker-bar{
            width:100%;
            background: var(--bg-soft);
            border-bottom: 1px solid var(--line);
            overflow: hidden;
            white-space: nowrap;
            padding: 9px 0;
            position: relative;
            z-index: 5;
        }
        .ticker-track{
            display: inline-flex;
            gap: 48px;
            animation: scrollTicker 38s linear infinite;
            padding-left: 48px;
            font-family: var(--mono);
            font-size: 0.78rem;
            letter-spacing: 0.02em;
        }
        .ticker-track span{ color: var(--ink-dim); }
        .ticker-track .up{ color: var(--green); }
        .ticker-track .down{ color: var(--red); }
        @keyframes scrollTicker{
            from{ transform: translateX(0); }
            to{ transform: translateX(-50%); }
        }
        @media (prefers-reduced-motion: reduce){
            .ticker-track{ animation: none; }
        }

        /* ===== HEADER ===== */
        .top-bar{
            display:flex; align-items:center; justify-content:space-between;
            padding: 18px 32px;
            position: relative; z-index: 5;
        }
        .brand{
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.12em;
            color: var(--ink);
            display:flex; align-items:center; gap:10px;
        }
        .brand .dot{
            width:9px; height:9px; border-radius:50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 1.6s infinite;
            flex-shrink:0;
        }
        @keyframes pulse{
            0%,100%{ opacity:1; transform:scale(1); }
            50%{ opacity:0.5; transform:scale(1.25); }
        }
        .language-selector {
            background: var(--bg-soft);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 7px 14px;
            color: var(--ink-dim);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: var(--mono);
        }
        .language-selector:hover{ border-color: var(--amber); color: var(--amber); }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            padding: 5vh 1.5rem 4rem;
            display:flex; flex-direction:column; align-items:center;
            text-align:center;
            background:
                radial-gradient(ellipse 900px 500px at 50% -10%, rgba(240,169,62,0.10), transparent 70%);
        }
        .container {
            max-width: 880px; width: 100%;
            margin: 0 auto;
            animation: fadeInUp 0.7s ease-out;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .eyebrow{
            display:inline-flex; align-items:center; gap:8px;
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--amber);
            border: 1px solid rgba(240,169,62,0.3);
            background: rgba(240,169,62,0.06);
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 1.75rem;
        }

        .main-title {
            font-size: clamp(2.4rem, 7vw, 4.6rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: 1.1rem;
            color: var(--ink);
        }
        .main-title .accent{
            color: var(--amber);
            font-family: var(--mono);
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--ink-dim);
            margin-bottom: 1.6rem;
            max-width: 540px;
            margin-left: auto; margin-right: auto;
            line-height: 1.6;
        }

        .mobile-tip {
            display: inline-flex; align-items:center; gap:6px;
            background: rgba(240,169,62,0.08);
            border: 1px solid rgba(240,169,62,0.25);
            color: var(--amber);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-family: var(--mono);
        }

        .online-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--bg-soft);
            padding: 7px 20px;
            border-radius: 50px;
            margin-bottom: 2rem;
            border: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--ink-dim);
        }
        .online-dot {
            width: 8px; height: 8px; background: var(--green); border-radius: 50%;
            box-shadow: 0 0 6px var(--green);
            animation: pulse 1.5s infinite;
        }
        .online-badge strong{ color: var(--ink); font-weight:600; }

        /* ===== BUTTONS ===== */
        .buttons-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-bottom: 2.5rem; }
        .btn-primary, .btn-formation {
            display: inline-flex; align-items:center; gap:8px;
            padding: 14px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.18s ease;
            font-family: var(--display);
        }
        .btn-primary {
            background: var(--amber);
            color: #0a0a0a;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(240,169,62,0.3); }
        .btn-formation {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
        }
        .btn-formation:hover { transform: translateY(-2px); border-color: var(--amber); color: var(--amber); }

        /* ===== FEATURE PILLS ===== */
        .features-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.7rem; margin-bottom: 3rem; }
        .feature-btn {
            background: var(--bg-soft);
            padding: 0.55rem 1.3rem;
            border-radius: 10px;
            border: 1px solid var(--line);
            transition: all 0.18s;
            display: inline-flex; align-items:center; gap:8px;
            text-decoration: none;
            color: var(--ink-dim);
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--mono);
        }
        .feature-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
            background: rgba(240,169,62,0.06);
        }

        /* ===== CARDS ===== */
        .cards-row { display: flex; flex-wrap: wrap; gap: 1.1rem; justify-content: center; max-width: 760px; margin: 0 auto; }
        .card {
            flex: 1; min-width: 260px; max-width: 320px;
            background: var(--bg-soft);
            border-radius: 14px;
            border: 1px solid var(--line);
            overflow: hidden;
            transition: all 0.25s;
            text-align: left;
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(240,169,62,0.4); }
        .card-header {
            padding: 0.7rem 1rem;
            border-bottom: 1px solid var(--line);
            font-weight: 600;
            color: var(--ink);
            font-size: 0.8rem;
            font-family: var(--mono);
            letter-spacing: 0.04em;
            display:flex; align-items:center; justify-content:space-between;
        }
        .card-header .live-tag{
            font-size:0.65rem; color: var(--green);
            border:1px solid rgba(63,185,80,0.3);
            background: rgba(63,185,80,0.08);
            padding: 2px 8px; border-radius: 20px;
            letter-spacing: 0.1em;
        }
        .card-body { padding: 0.9rem; text-align: center; }
        .card-body img { max-width: 100%; border-radius: 10px; max-height: 150px; object-fit: cover; display:block; }
        .update-time { font-size: 0.65rem; color: var(--ink-dim); margin-top: 0.6rem; font-family: var(--mono); text-align:left; padding-left:2px; }
        .empty-card { display: flex; align-items: center; justify-content: center; min-height: 150px; flex-direction: column; gap: 0.5rem; color: var(--ink-dim); }
        .empty-card .emoji { font-size: 1.8rem; opacity:0.5; }
        .empty-card .label{ font-family: var(--mono); font-size: 0.75rem; letter-spacing:0.05em; }

        footer { margin-top: 3rem; color: #545d68; font-size: 0.7rem; text-align: center; padding: 1.2rem; font-family: var(--mono); }

        @media (max-width: 700px) {
            .top-bar{ padding: 14px 18px; }
            .hero{ padding-top: 2vh; }
            .cards-row { flex-direction: column; align-items: center; }
            .card { max-width: 100%; width:100%; }
        }
    </style>
</head>
<body>
    <div class="ticker-bar">
        <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <div class="top-bar">
        <div class="brand"><span class="dot"></span>RICK_TRADING</div>
        <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
            <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
            <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
            <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
        </select>
    </div>

    <div class="hero">
        <div class="container">
            <div class="eyebrow" id="eyebrowTag">📡 Marché en direct · WebSocket Deriv</div>
            <h1 class="main-title" id="title"></h1>
            <div class="mobile-tip" id="mobileTip">📱 Mode PC recommandé sur mobile</div>
            <p class="subtitle" id="subtitle"></p>
            <div class="online-badge">
                <span class="online-dot"></span>
                <strong id="onlineCount">0</strong>
                <span id="onlineLabel"></span>
            </div>
            <div class="buttons-group">
                <a href="/app" id="launchBtn" class="btn-primary"></a>
                <a href="/coming-soon" id="formationBtn" class="btn-formation"><span id="trainingFollowupTitle">Formation en trading avec suivi</span></a>
            </div>
            <div class="features-row">
                <a href="/coming-soon" class="feature-btn"><span class="feature-icon">📈</span><span id="feature1"></span></a>
                <a href="/coming-soon" class="feature-btn"><span class="feature-icon">🔔</span><span id="feature2"></span></a>
                <a href="/formation" class="feature-btn"><span class="feature-icon">🎓</span><span id="feature3">Formation gratuite de trading</span></a>
            </div>
            <div class="cards-row">
                <div class="card">
                    <div class="card-header"><span id="marketPreview"></span><span class="live-tag">LIVE</span></div>
                    <div class="card-body">
                        <img id="chartPreview" src="" alt="Graphique">
                        <div class="update-time" id="chartUpdateTime"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><span id="partnerSpace"></span></div>
                    <div class="card-body empty-card">
                        <div class="emoji">⚡</div>
                        <div class="label">À venir</div>
                    </div>
                </div>
            </div>
            <footer><p id="footer"></p></footer>
        </div>
    </div>

    <script>
        // Traductions pour le bouton formation avec suivi
        const trainingFollowupTranslations = {
            fr: "Formation en trading avec suivi",
            en: "Trading training with follow-up",
            es: "Formación en trading con seguimiento",
            pt: "Formação em trading com acompanhamento",
            ru: "Обучение трейдингу с сопровождением",
            it: "Formazione sul trading con supporto",
            de: "Trading Ausbildung mit Betreuung",
            zh: "带跟进的交易培训",
            ja: "フォローアップ付きトレーニング"
        };

        const mobileTips = {
            fr: "📱 Mode PC recommandé sur mobile",
            en: "📱 Desktop mode recommended on mobile",
            es: "📱 Modo PC recomendado en móvil",
            pt: "📱 Modo PC recomendado no celular",
            ru: "📱 Рекомендуется режим ПК на мобильном",
            it: "📱 Modalità PC consigliata su mobile",
            de: "📱 PC-Modus auf Mobilgeräten empfohlen",
            zh: "📱 手机上推荐使用PC模式",
            ja: "📱 モバイルではPCモード推奨"
        };

        const eyebrowTranslations = {
            fr: "📡 Marché en direct · WebSocket Deriv",
            en: "📡 Live market · Deriv WebSocket",
            es: "📡 Mercado en vivo · WebSocket Deriv",
            pt: "📡 Mercado em tempo real · WebSocket Deriv",
            ru: "📡 Рынок в реальном времени · WebSocket Deriv",
            it: "📡 Mercato live · WebSocket Deriv",
            de: "📡 Live-Markt · Deriv WebSocket",
            zh: "📡 实时市场 · Deriv WebSocket",
            ja: "📡 ライブ市場 · Deriv WebSocket"
        };

        function updateMobileTip() {
            const lang = getCurrentLanguage();
            const el = document.getElementById('mobileTip');
            if (el) el.textContent = mobileTips[lang] || mobileTips.fr;
        }

        function updateEyebrow() {
            const lang = getCurrentLanguage();
            const el = document.getElementById('eyebrowTag');
            if (el) el.textContent = eyebrowTranslations[lang] || eyebrowTranslations.fr;
        }

        function updateTrainingFollowup() {
            const lang = getCurrentLanguage();
            const el = document.getElementById('trainingFollowupTitle');
            if (el && trainingFollowupTranslations[lang]) {
                el.textContent = trainingFollowupTranslations[lang];
            } else if (el) {
                el.textContent = trainingFollowupTranslations.fr;
            }
        }

        function updatePage() {
            document.getElementById('title').innerHTML = t('title').replace(/Rick Trading/i, 'Rick <span class="accent">Trading</span>');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('launchBtn').innerHTML = t('launch');
            document.getElementById('feature1').textContent = t('feature1');
            document.getElementById('feature2').textContent = t('feature2');
            document.getElementById('feature3').innerHTML = t('feature3');
            document.getElementById('footer').innerHTML = t('footer');
            document.getElementById('marketPreview').textContent = t('market_preview');
            document.getElementById('partnerSpace').textContent = t('partner_space');
            document.getElementById('onlineLabel').textContent = t('online');
            document.getElementById('languageSelect').value = getCurrentLanguage();
            updateMobileTip();
            updateTrainingFollowup();
            updateEyebrow();
        }

        function changeLanguage() {
            setLanguage(document.getElementById('languageSelect').value);
        }

        async function updateOnlineCount() {
            try { const res = await fetch('/api/online-display'); const data = await res.json(); document.getElementById('onlineCount').innerText = data.online; } catch(e) {}
        }

        async function updateChartPreview() {
            try { const res = await fetch('/api/chart-screenshot'); const data = await res.json(); const img = document.getElementById('chartPreview'); if (img && data.image_url) { img.src = data.image_url + '?t=' + new Date().getTime(); document.getElementById('chartUpdateTime').innerHTML = '🕒 ' + data.updated_at; } } catch(e) {}
        }

        // ===== TICKER : prix live via WebSocket Deriv =====
        const tickerSymbols = [
            { sym: 'R_75', label: 'VOLATILITY 75' },
            { sym: 'frxEURUSD', label: 'EUR/USD' },
            { sym: 'frxXAUUSD', label: 'XAU/USD' }
        ];
        let tickerPrices = {};

        function renderTicker() {
            const track = document.getElementById('tickerTrack');
            if (!track) return;
            let items = tickerSymbols.map(s => {
                const p = tickerPrices[s.sym];
                if (!p) return `<span>${s.label} &nbsp;···</span>`;
                const dec = s.sym.includes('frx') ? 5 : 2;
                const cls = p.dir === 'up' ? 'up' : p.dir === 'down' ? 'down' : '';
                const arrow = p.dir === 'up' ? '▲' : p.dir === 'down' ? '▼' : '·';
                return `<span>${s.label} &nbsp;<span class="${cls}">${p.value.toFixed(dec)} ${arrow}</span></span>`;
            });
            // dupliqué pour boucle continue
            track.innerHTML = items.join('') + items.join('');
        }

        function connectTicker() {
            try {
                const ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
                ws.onopen = () => {
                    tickerSymbols.forEach(s => ws.send(JSON.stringify({ ticks: s.sym, subscribe: 1 })));
                };
                ws.onmessage = (m) => {
                    const d = JSON.parse(m.data);
                    if (d.tick) {
                        const sym = d.tick.symbol;
                        const newVal = +d.tick.quote;
                        const prev = tickerPrices[sym];
                        let dir = prev ? (newVal > prev.value ? 'up' : newVal < prev.value ? 'down' : prev.dir) : null;
                        tickerPrices[sym] = { value: newVal, dir: dir };
                        renderTicker();
                    }
                };
                ws.onerror = () => {};
                ws.onclose = () => setTimeout(connectTicker, 8000);
            } catch (e) {}
        }

        // Initialisation
        renderTicker();
        connectTicker();
        updatePage();
        updateOnlineCount();
        updateChartPreview();
        setInterval(updateOnlineCount, 35000);
        setInterval(updateChartPreview, 600000);
    </script>
</body>
</html>
