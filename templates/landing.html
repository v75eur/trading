<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick Trading | Accueil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: #0a0a0a;
        }

        /* Hero section pleine hauteur */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            isolation: isolate;
        }

        /* Image de fond animée (zoom lent + surbrillance) */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.4) saturate(1.2);
            transition: transform 0.3s ease-out, filter 0.5s ease;
            will-change: transform;
        }

        /* Overlay dynamique */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
        }

        /* Contenu principal */
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            padding: 2rem;
            animation: fadeInUp 1s ease-out;
        }

        /* Titre avec gradient animé */
        h1 {
            font-size: 4.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff, #f59e0b, #ffb347);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 4s linear infinite;
        }

        /* Sous-titre */
        .subtitle {
            font-size: 1.3rem;
            color: #cbd5e1;
            margin-bottom: 2rem;
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 0 1rem;
        }

        /* Badge en ligne animé */
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            padding: 0.6rem 1.8rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            border: 1px solid rgba(63, 185, 80, 0.6);
            box-shadow: 0 0 15px rgba(63, 185, 80, 0.2);
            transition: all 0.3s;
        }

        .online-dot {
            width: 12px;
            height: 12px;
            background: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 8px #3fb950;
            animation: pulse 1.2s infinite;
        }

        /* Bouton principal */
        .btn-primary {
            display: inline-block;
            background: linear-gradient(95deg, #f59e0b, #d97706);
            color: white;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
            margin: 0.5rem;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 28px rgba(245, 158, 11, 0.5);
            filter: brightness(1.05);
        }

        /* Cartes services */
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            margin-top: 3rem;
        }

        .feature-card {
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 32px;
            width: 200px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: default;
        }

        .feature-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #f59e0b;
            background: rgba(30, 30, 50, 0.8);
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.4);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            display: inline-block;
            transition: transform 0.2s;
        }

        .feature-card:hover .feature-icon {
            transform: scale(1.1);
        }

        .feature-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f59e0b;
        }

        /* Sélecteur langue */
        .language-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 40px;
            padding: 0.5rem 1rem;
            color: #f59e0b;
            font-weight: 500;
            cursor: pointer;
            z-index: 100;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .language-selector:hover {
            border-color: #f59e0b;
            background: rgba(0,0,0,0.8);
        }

        /* Animation clavier */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.5; transform: scale(1.2);}
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1rem; }
            .feature-card { width: 160px; padding: 1rem; }
            .btn-primary { padding: 0.8rem 1.8rem; font-size: 1rem; }
            .online-badge { padding: 0.4rem 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Image de fond animée (zoom très lent au survol) -->
    <div class="hero">
        <img src="/static/rick.jpeg" alt="Rick Trading Background" class="hero-bg" id="bgImage">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <!-- Badge en ligne animé -->
            <div class="online-badge">
                <span class="online-dot"></span>
                <span id="onlineCount" style="font-weight:bold;">0</span>
                <span id="onlineLabel">en ligne</span>
            </div>

            <h1 id="title">📊 Rick Trading</h1>
            <p class="subtitle" id="subtitle">Plateforme professionnelle d'analyse de marché, signaux en temps réel et communauté active</p>

            <div>
                <a href="/app" id="launchBtn" class="btn-primary">🚀 Accéder à la plateforme</a>
            </div>

            <!-- Cartes services animées -->
            <div class="features">
                <div class="feature-card">
                    <div class="feature-icon">📈</div>
                    <h3 id="feature1">Signaux live</h3>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🔔</div>
                    <h3 id="feature2">Notifications APK</h3>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">💬</div>
                    <h3 id="feature3">Chat communautaire</h3>
                </div>
            </div>
        </div>
    </div>

    <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
        <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
        <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
        <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
    </select>

    <script>
        function updatePage() {
            document.getElementById('title').textContent = t('title');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('launchBtn').innerHTML = t('launch');
            document.getElementById('feature1').textContent = t('feature1');
            document.getElementById('feature2').textContent = t('feature2');
            document.getElementById('feature3').textContent = t('feature3');
            document.getElementById('onlineLabel').textContent = t('online');
            document.getElementById('languageSelect').value = getCurrentLanguage();
        }

        function changeLanguage() {
            setLanguage(document.getElementById('languageSelect').value);
        }

        async function updateOnlineCount() {
            try {
                const res = await fetch('/api/online-display');
                const data = await res.json();
                document.getElementById('onlineCount').innerText = data.online;
            } catch(e) {}
        }

        // Animation de mouvement subtile sur l'image de fond (effet "virtuel")
        const bg = document.getElementById('bgImage');
        if (bg) {
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.pageX) / 80;
                const y = (window.innerHeight / 2 - e.pageY) / 80;
                bg.style.transform = `translate(${x}px, ${y}px) scale(1.02)`;
            });
        }

        updatePage();
        updateOnlineCount();
        setInterval(updateOnlineCount, 35000);
    </script>
</body>
</html>
