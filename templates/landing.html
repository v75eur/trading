<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #ffffff; min-height: 100vh; overflow-x: hidden; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle at 20% 50%, #1a1a2e 0%, #0a0a0a 100%); overflow: hidden; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.12; z-index: 0; transition: transform 0.3s ease-out; }
        .container { position: relative; z-index: 2; max-width: 1200px; width: 90%; margin: 0 auto; text-align: center; padding: 1rem; animation: fadeInUp 0.7s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .main-title { font-size: 3.8rem; font-weight: 900; margin-bottom: 0.75rem; background: linear-gradient(135deg, #ffffff 0%, #f59e0b 40%, #ffedd5 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .mobile-tip { display: inline-block; background: rgba(245,158,11,0.15); border: 1px solid #f59e0b; color: #f59e0b; padding: 6px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 500; margin-bottom: 0.75rem; animation: blinkTip 1.5s infinite; backdrop-filter: blur(4px); }
        @keyframes blinkTip { 0%,100% { opacity: 0.7; } 50% { opacity: 1; background: rgba(245,158,11,0.25); } }
        .subtitle { font-size: 1rem; color: #94a3b8; margin-bottom: 1.5rem; max-width: 550px; margin-left: auto; margin-right: auto; }
        .online-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(26,26,46,0.5); backdrop-filter: blur(8px); padding: 6px 20px; border-radius: 60px; margin-bottom: 1.5rem; border: 1px solid rgba(63,185,80,0.4); }
        .online-dot { width: 10px; height: 10px; background: #3fb950; border-radius: 50%; box-shadow: 0 0 6px #3fb950; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
        .btn-primary { display: inline-block; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 10px 32px; font-size: 0.95rem; font-weight: 700; border-radius: 60px; text-decoration: none; margin-bottom: 1.5rem; transition: all 0.2s; box-shadow: 0 4px 15px rgba(245,158,11,0.25); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,158,11,0.35); }
        .features-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; margin-bottom: 1.5rem; }
        .feature-pill { background: rgba(255,255,255,0.03); backdrop-filter: blur(8px); padding: 0.4rem 1rem; border-radius: 40px; border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s; }
        .feature-pill:hover { transform: translateY(-2px); border-color: #f59e0b; background: rgba(245,158,11,0.1); }
        .feature-icon { font-size: 0.9rem; margin-right: 4px; }
        .feature-pill span { font-size: 0.8rem; font-weight: 500; }
        .cards-row { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; max-width: 700px; margin: 0 auto; }
        .card { flex: 1; min-width: 230px; max-width: 270px; background: rgba(13,17,23,0.6); backdrop-filter: blur(10px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.06); overflow: hidden; transition: all 0.25s; }
        .card:hover { transform: translateY(-4px); border-color: #f59e0b; }
        .card-header { background: rgba(22,27,34,0.7); padding: 0.6rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06); font-weight: 700; color: #f59e0b; font-size: 0.8rem; }
        .card-body { padding: 0.8rem; text-align: center; }
        .card-body img { max-width: 100%; border-radius: 16px; max-height: 120px; object-fit: cover; }
        .update-time { font-size: 0.55rem; color: #8b949e; margin-top: 0.4rem; }
        .empty-card { display: flex; align-items: center; justify-content: center; min-height: 120px; flex-direction: column; gap: 0.3rem; }
        .empty-card .emoji { font-size: 1.8rem; }
        .language-selector { position: fixed; top: 12px; right: 12px; background: rgba(30,41,59,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(245,158,11,0.5); border-radius: 40px; padding: 4px 10px; color: #f59e0b; cursor: pointer; z-index: 100; font-size: 0.7rem; }
        .language-selector:hover { background: #f59e0b; color: #0a0a0a; }
        footer { margin-top: 1rem; color: #64748b; font-size: 0.6rem; text-align: center; padding: 0.5rem; }
        @media (max-width: 700px) { .main-title { font-size: 2rem; } .cards-row { flex-direction: column; align-items: center; } .card { max-width: 100%; } .mobile-tip { font-size: 0.65rem; padding: 4px 12px; } }
    </style>
</head>
<body>
    <img src="/static/rick.jpeg" alt="Rick Trading" class="hero-bg">
    <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
        <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
        <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
        <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
    </select>

    <div class="hero">
        <div class="container">
            <h1 class="main-title" id="title"></h1>
            <div class="mobile-tip" id="mobileTip">📱 Mode PC recommandé sur mobile</div>
            <p class="subtitle" id="subtitle"></p>
            <div class="online-badge">
                <span class="online-dot"></span>
                <span id="onlineCount" style="font-weight:700;">0</span>
                <span id="onlineLabel"></span>
            </div>
            <a href="/app" id="launchBtn" class="btn-primary"></a>
            <div class="features-row">
                <div class="feature-pill"><span class="feature-icon">📈</span><span id="feature1"></span></div>
                <div class="feature-pill"><span class="feature-icon">🔔</span><span id="feature2"></span></div>
                <div class="feature-pill"><span class="feature-icon">💬</span><span id="feature3"></span></div>
            </div>
            <div class="cards-row">
                <div class="card">
                    <div class="card-header"><span id="marketPreview"></span></div>
                    <div class="card-body">
                        <img id="chartPreview" src="" alt="Graphique">
                        <div class="update-time" id="chartUpdateTime"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><span id="partnerSpace"></span></div>
                    <div class="card-body empty-card">
                        <div class="emoji">⚡</div>
                        <div>À venir</div>
                    </div>
                </div>
            </div>
            <footer><p id="footer"></p></footer>
        </div>
    </div>

    <script>
        const mobileTips = {
            fr: "📱 Mode PC recommandé sur mobile", en: "📱 Desktop mode recommended on mobile", es: "📱 Modo PC recomendado en móvil",
            pt: "📱 Modo PC recomendado no celular", ru: "📱 Рекомендуется режим ПК на мобильном", it: "📱 Modalità PC consigliata su mobile",
            de: "📱 PC-Modus auf Mobilgeräten empfohlen", zh: "📱 手机上推荐使用PC模式", ja: "📱 モバイルではPCモード推奨"
        };
        function updateMobileTip() { const lang=getCurrentLanguage(); const el=document.getElementById('mobileTip'); if(el) el.textContent=mobileTips[lang]||mobileTips.fr; }
        function updatePage() {
            document.getElementById('title').textContent=t('title'); document.getElementById('subtitle').textContent=t('subtitle');
            document.getElementById('launchBtn').innerHTML=t('launch'); document.getElementById('feature1').textContent=t('feature1');
            document.getElementById('feature2').textContent=t('feature2'); document.getElementById('feature3').textContent=t('feature3');
            document.getElementById('footer').innerHTML=t('footer'); document.getElementById('marketPreview').textContent=t('market_preview');
            document.getElementById('partnerSpace').textContent=t('partner_space'); document.getElementById('onlineLabel').textContent=t('online');
            document.getElementById('languageSelect').value=getCurrentLanguage(); updateMobileTip();
        }
        function changeLanguage() { setLanguage(document.getElementById('languageSelect').value); setTimeout(()=>updateMobileTip(),30); }
        async function updateOnlineCount(){ try{const r=await fetch('/api/online-display'),d=await r.json();document.getElementById('onlineCount').innerText=d.online;}catch(e){} }
        async function updateChartPreview(){ try{const r=await fetch('/api/chart-screenshot'),d=await r.json();const i=document.getElementById('chartPreview');if(i&&d.image_url){i.src=d.image_url+'?t='+new Date().getTime();document.getElementById('chartUpdateTime').innerHTML='🕒 '+d.updated_at;}}catch(e){} }
        updatePage(); updateOnlineCount(); updateChartPreview();
        setInterval(updateOnlineCount,35000); setInterval(updateChartPreview,600000);
    </script>
</body>
</html>
