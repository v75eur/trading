<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0a0a0f;
            color: #ffffff; 
            min-height: 100vh; 
        }
        
        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
            padding: 1rem 2rem;
        }
        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .language-selector {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 0.5rem 1rem;
            color: #f59e0b;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .language-selector:hover {
            background: #f59e0b;
            color: #0a0a0f;
        }
        
        /* Hero Section - Nouvelle disposition */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem 3rem;
            background: radial-gradient(circle at 30% 40%, #1a1a2e 0%, #0a0a0f 100%);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Zone de gauche (texte + boutons) et droite (image) */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }
        
        .hero-content {
            text-align: left;
        }
        
        .hero-image {
            background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(139,92,246,0.1));
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .main-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #f59e0b 40%, #ffedd5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        /* Online badge repositionné */
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(63, 185, 80, 0.1);
            backdrop-filter: blur(8px);
            padding: 0.4rem 1rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }
        .online-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; transform: scale(1.2); } }
        
        /* Boutons principaux */
        .buttons-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 0.8rem 1.8rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 60px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(245,158,11,0.25);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,158,11,0.4); }
        
        .btn-formation {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: white;
            padding: 0.8rem 1.8rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 60px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(139,92,246,0.3);
        }
        .btn-formation:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,92,246,0.4); }
        
        /* Features badges (en dessous des boutons) */
        .features-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .feature-btn {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s;
            text-decoration: none;
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .feature-btn:hover {
            transform: translateY(-2px);
            border-color: #f59e0b;
            background: rgba(245,158,11,0.1);
        }
        
        /* Cartes en bas (disposition horizontale) */
        .cards-section {
            margin-top: 4rem;
        }
        .cards-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #f59e0b;
        }
        .cards-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }
        .card {
            flex: 1;
            min-width: 250px;
            max-width: 300px;
            background: rgba(20, 25, 40, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
            transition: all 0.3s;
        }
        .card:hover { 
            transform: translateY(-5px); 
            border-color: #f59e0b;
        }
        .card-header {
            background: rgba(30, 35, 50, 0.7);
            padding: 0.7rem;
            text-align: center;
            font-weight: 600;
            color: #f59e0b;
            font-size: 0.8rem;
        }
        .card-body {
            padding: 1rem;
            text-align: center;
        }
        .card-body img {
            max-width: 100%;
            border-radius: 16px;
            max-height: 120px;
            object-fit: cover;
        }
        .update-time {
            font-size: 0.6rem;
            color: #8b949e;
            margin-top: 0.5rem;
        }
        .empty-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        /* Footer */
        footer {
            margin-top: 3rem;
            color: #64748b;
            font-size: 0.7rem;
            text-align: center;
            padding: 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        @media (max-width: 900px) {
            .hero-grid { grid-template-columns: 1fr; gap: 2rem; text-align: center; }
            .hero-content { text-align: center; }
            .buttons-group { justify-content: center; }
            .features-row { justify-content: center; }
            .online-badge { justify-content: center; }
            .main-title { font-size: 2.5rem; }
        }
        
        @media (max-width: 700px) {
            .cards-row { flex-direction: column; align-items: center; }
            .card { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-container">
        <div class="logo">Rick Trading</div>
        <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
            <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
            <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
            <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
        </select>
    </div>
</nav>

<section class="hero">
    <div class="container">
        <div class="hero-grid">
            <!-- Colonne gauche : texte + boutons -->
            <div class="hero-content">
                <div class="online-badge">
                    <span class="online-dot"></span>
                    <span id="onlineCount" style="font-weight:600;">0</span>
                    <span id="onlineLabel"></span>
                </div>
                <h1 class="main-title" id="title"></h1>
                <p class="subtitle" id="subtitle"></p>
                <div class="buttons-group">
                    <a href="/app" id="launchBtn" class="btn-primary"></a>
                    <a href="/coming-soon" id="formationBtn" class="btn-formation"><span id="trainingFollowupTitle">Formation en trading avec suivi</span></a>
                </div>
                <div class="features-row">
                    <a href="/coming-soon" class="feature-btn"><span id="feature1"></span></a>
                    <a href="/coming-soon" class="feature-btn"><span id="feature2"></span></a>
                    <a href="/formation" class="feature-btn"><span id="feature3"></span></a>
                </div>
            </div>
            
            <!-- Colonne droite : image / chart preview -->
            <div class="hero-image">
                <div class="card" style="background: transparent; border: none;">
                    <div class="card-header"><span id="marketPreview"></span></div>
                    <div class="card-body">
                        <img id="chartPreview" src="" alt="Graphique">
                        <div class="update-time" id="chartUpdateTime"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Section cartes en bas -->
        <div class="cards-section">
            <div class="cards-title" id="partnerSpace"></div>
            <div class="cards-row">
                <div class="card">
                    <div class="card-header">À venir</div>
                    <div class="card-body empty-card">
                        <div style="font-size:1.5rem;">⚡</div>
                        <div>Nouveautés</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">À venir</div>
                    <div class="card-body empty-card">
                        <div style="font-size:1.5rem;">📊</div>
                        <div>Analyses</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">Communauté</div>
                    <div class="card-body empty-card">
                        <div style="font-size:1.5rem;">💬</div>
                        <div>Chat en direct</div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer><p id="footer"></p></footer>
    </div>
</section>

<script>
    const trainingFollowupTranslations = {
        fr: "Formation en trading avec suivi",
        en: "Trading training with follow-up",
        es: "Formación en trading con seguimiento",
        pt: "Formação em trading com acompanhamento",
        ru: "Обучение трейдингу с сопровождением",
        it: "Formazione sul trading con supporto",
        de: "Trading Ausbildung mit Betreuung",
        zh: "带跟进的交易培训",
        ja: "フォローアップ付きトレーニング"
    };

    function updatePage() {
        const lang = getCurrentLanguage();
        document.getElementById('title').textContent = t('title');
        document.getElementById('subtitle').textContent = t('subtitle');
        document.getElementById('launchBtn').innerHTML = t('launch');
        document.getElementById('feature1').textContent = t('feature1');
        document.getElementById('feature2').textContent = t('feature2');
        document.getElementById('feature3').innerHTML = t('feature3');
        document.getElementById('footer').innerHTML = t('footer');
        document.getElementById('marketPreview').textContent = t('market_preview');
        document.getElementById('partnerSpace').textContent = t('partner_space');
        document.getElementById('onlineLabel').textContent = t('online');
        document.getElementById('languageSelect').value = lang;
        
        const trainingEl = document.getElementById('trainingFollowupTitle');
        if (trainingEl && trainingFollowupTranslations[lang]) {
            trainingEl.textContent = trainingFollowupTranslations[lang];
        }
    }
    
    function changeLanguage() { 
        setLanguage(document.getElementById('languageSelect').value); 
    }
    
    async function updateOnlineCount() {
        try { 
            const res = await fetch('/api/online-display'); 
            const data = await res.json(); 
            document.getElementById('onlineCount').innerText = data.online; 
        } catch(e) {}
    }
    
    async function updateChartPreview() {
        try { 
            const res = await fetch('/api/chart-screenshot'); 
            const data = await res.json(); 
            const img = document.getElementById('chartPreview'); 
            if (img && data.image_url) { 
                img.src = data.image_url + '?t=' + new Date().getTime(); 
                document.getElementById('chartUpdateTime').innerHTML = '🕒 ' + data.updated_at; 
            } 
        } catch(e) {}
    }
    
    updatePage();
    updateOnlineCount();
    updateChartPreview();
    setInterval(updateOnlineCount, 35000);
    setInterval(updateChartPreview, 600000);
</script>
</body>
</html>
