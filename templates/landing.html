<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }
        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.2;
            z-index: 0;
        }
        .content {
            position: relative;
            z-index: 1;
            max-width: 800px;
        }
        h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #fff, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.3s;
            margin: 0.5rem;
        }
        .btn-primary:hover {
            transform: scale(1.05);
        }
        .features {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 3rem;
        }
        .feature {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 20px;
            width: 200px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        footer {
            margin-top: 4rem;
            color: #64748b;
            font-size: 0.8rem;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .features { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <img src="/static/rick.jpeg" alt="Rick Trading" class="hero-image">
    <div class="content">
        <h1>📊 Rick Trading</h1>
        <p class="subtitle">Plateforme professionnelle d'analyse de marché, signaux en temps réel et communauté active</p>
        
        <a href="/app" class="btn-primary">🚀 Accéder à la plateforme</a>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📈</div>
                <div>Signaux live</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔔</div>
                <div>Notifications APK</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💬</div>
                <div>Chat communautaire</div>
            </div>
        </div>
        
        <footer>
            <p>© 2025 Rick Trading - Le trading comporte des risques</p>
        </footer>
    </div>
</body>
</html>
