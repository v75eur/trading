<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rick Trading</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#0d1117;color:#c9d1d9;overflow:hidden;display:flex;height:100vh}
.left{flex:1;display:flex;flex-direction:column;min-width:0}
.top{background:#161b22;padding:8px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;flex-wrap:wrap;gap:5px}
.top h1{color:#58a6ff;font-size:16px}
.ctrls{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ctrls select,.ctrls button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:4px 7px;border-radius:4px;font-size:11px;cursor:pointer}
.live{font-weight:bold;color:#3fb950;font-size:13px;min-width:80px}
#chart{width:100%;flex:1;display:block}
.info{background:#161b22;padding:6px 10px;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;border-top:1px solid #30363d}
.info span{background:#0d1117;padding:4px 8px;border-radius:3px}
.trend-bar{background:#161b22;padding:5px 15px;text-align:center;font-size:13px;border-top:1px solid #30363d}
#loader{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:998;display:none}
.spinner{width:40px;height:40px;border:3px solid #30363d;border-top:3px solid #58a6ff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* CHAT STYLE YOUTUBE */
.chat-panel{width:320px;background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column;height:100vh}
.chat-header{background:#21262d;padding:10px;text-align:center;font-weight:bold;color:#58a6ff;font-size:14px;border-bottom:1px solid #30363d;flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:8px;min-height:0}
.chat-msg{padding:6px 8px;margin:3px 0;background:#0d1117;border-radius:4px;font-size:14px;line-height:1.3;word-wrap:break-word;animation:fadeIn 0.2s}
.chat-msg .time{color:#666;font-size:10px;margin-right:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.chat-input-area{padding:8px;border-top:1px solid #30363d;flex-shrink:0;background:#161b22}
.chat-input-area input{width:100%;background:#0d1117;color:white;border:1px solid #30363d;padding:10px;border-radius:20px;font-size:14px;margin-bottom:6px;outline:none}
.chat-input-area input:focus{border-color:#58a6ff}
.chat-input-area button{width:100%;background:#3ea6ff;color:#0d1117;border:none;padding:8px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:bold}
.chat-input-area button:hover{background:#58b6ff}

.like-container{position:fixed;bottom:20px;right:340px;z-index:9999;display:flex;align-items:center;gap:8px}
.like-btn{background:rgba(22,27,34,0.95);border:2px solid #f85149;color:#f85149;font-size:22px;width:50px;height:50px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.like-btn:hover{background:#f85149;color:white}
.like-btn.liked{background:#f85149;color:white;cursor:default}
.like-count{background:rgba(22,27,34,0.95);color:white;padding:8px 14px;border-radius:20px;font-weight:bold;font-size:15px;border:1px solid #30363d}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.like-count.up{animation:pulse 0.5s}

#adminTrigger{position:fixed;bottom:10px;left:10px;z-index:9999;width:20px;height:20px;border-radius:50%;background:rgba(22,27,34,0.8);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#adminTrigger:hover{background:rgba(22,27,34,1);border-color:#d29922;color:#d29922}
#adminOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:99999;display:none;justify-content:center;align-items:center}
.admin-box{background:#161b22;border:1px solid #d29922;border-radius:15px;padding:2rem;width:90%;max-width:400px;text-align:center;position:relative}
.admin-box h3{color:#d29922;margin-bottom:1rem}
.admin-box input{width:100%;padding:0.8rem;margin:0.5rem 0;background:#0d1117;color:white;border:1px solid #30363d;border-radius:8px;text-align:center;font-size:1rem}
.admin-box button{padding:0.8rem 2rem;background:#d29922;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:0.5rem}
.admin-box .stats{text-align:left;margin-top:1rem;padding:1rem;background:#0d1117;border-radius:8px;line-height:2.2}
.admin-box .stats span{color:#58a6ff;font-weight:bold}
#closeAdmin{position:absolute;top:8px;right:12px;color:#666;cursor:pointer;font-size:1.2rem;background:none;border:none}
#closeAdmin:hover{color:white}
</style>
</head>
<body>
<div class="left">
<div class="top">
    <h1>📊 Rick Trading</h1>
    <div class="ctrls">
        <select id="sym" onchange="changeSymbol()">
            <option value="R_75">Volatility 75</option>
            <option value="frxEURUSD">EUR/USD</option>
            <option value="frxXAUUSD">XAU/USD</option>
        </select>
        <select id="tf" onchange="changeTF()">
            <option value="5" selected>M5</option>
            <option value="60">H1</option>
        </select>
        <span class="live" id="price">---</span>
        <button onclick="zoomIn()">+</button><button onclick="zoomOut()">-</button><button onclick="resetZoom()">↺</button>
    </div>
</div>
<div id="loader"><div class="spinner"></div></div>
<canvas id="chart"></canvas>
<div class="trend-bar" id="trendGeneral">--</div>
<div class="info">
    <span id="canal">Canal: --</span>
    <span id="sr">S/R: --</span>
    <span id="pat">Signaux: --</span>
    <span id="stats">Stats: --</span>
</div>
</div>

<!-- CHAT -->
<div class="chat-panel">
    <div class="chat-header">💬 Chat Live</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Saisissez votre message..." onkeypress="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">ENVOYER</button>
    </div>
</div>

<div class="like-container">
    <div class="like-count" id="likeCount">545</div>
    <button class="like-btn" id="likeBtn" onclick="addLike()" title="J'aime">❤️</button>
</div>
<button id="adminTrigger" title="Admin">⚙</button>
<div id="adminOverlay">
    <div class="admin-box">
        <button id="closeAdmin" onclick="closeAdminPopup()">✕</button>
        <h3>⚙️ Administration</h3>
        <div id="loginForm">
            <input type="password" id="adminPass" placeholder="Mot de passe">
            <button onclick="checkAdminPass()">🔓 Accéder</button>
            <p id="adminError" style="color:#f85149;display:none;">Mot de passe incorrect</p>
        </div>
        <div id="adminStats" style="display:none;">
            <div class="stats"><p>👥 <span id="onlineNow">0</span> en ligne</p><p>❤️ <span id="totalLikes">545</span> likes</p><p>📊 <span id="totalVisitors">0</span> visiteurs</p></div>
            <button onclick="closeAdminPopup()" style="background:#30363d;">Fermer</button>
        </div>
    </div>
</div>

<script>
var IS_ADMIN=false;
var _k=null;
(async function(){var _d=new TextEncoder().encode('AlidaBerenice1994');var _h=await crypto.subtle.digest('SHA-256',_d);_k=Array.from(new Uint8Array(_h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');})();
async function registerVisit(){await fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin:IS_ADMIN})});}
async function loadStats(){try{var res=await fetch('/api/stats');var data=await res.json();document.getElementById('likeCount').textContent=data.likes;}catch(e){}}
async function addLike(){try{var res=await fetch('/api/like',{method:'POST'});var data=await res.json();document.getElementById('likeCount').textContent=data.likes;document.getElementById('likeCount').classList.add('up');setTimeout(function(){document.getElementById('likeCount').classList.remove('up');},500);if(data.status==='ok')document.getElementById('likeBtn').classList.add('liked');}catch(e){}}
document.getElementById('adminTrigger').addEventListener('click',function(){document.getElementById('adminOverlay').style.display='flex';document.getElementById('loginForm').style.display='block';document.getElementById('adminStats').style.display='none';});
function closeAdminPopup(){document.getElementById('adminOverlay').style.display='none';}
async function checkAdminPass(){var _p=document.getElementById('adminPass').value;var _e=new TextEncoder().encode(_p);var _h=await crypto.subtle.digest('SHA-256',_e);var _s=Array.from(new Uint8Array(_h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');if(_s===_k){IS_ADMIN=true;await registerVisit();document.getElementById('loginForm').style.display='none';document.getElementById('adminStats').style.display='block';var res=await fetch('/api/stats');var data=await res.json();document.getElementById('onlineNow').textContent=data.online;document.getElementById('totalLikes').textContent=data.likes;document.getElementById('totalVisitors').textContent=data.visitors;}else{document.getElementById('adminError').style.display='block';}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAdminPopup();});
async function loadChat(){try{var res=await fetch('/api/chat');var msgs=await res.json();var el=document.getElementById('chatMessages');el.innerHTML=msgs.map(function(m){return'<div class="chat-msg"><span class="time">'+m.time+'</span>'+m.message+'</div>';}).join('');el.scrollTop=el.scrollHeight;}catch(e){}}
async function sendChat(){var input=document.getElementById('chatInput');var msg=input.value.trim();if(!msg)return;await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});input.value='';loadChat();}
loadChat();setInterval(loadChat,3000);
registerVisit();loadStats();setInterval(loadStats,10000);
</script>
<script src="/static/chart.js"></script>
</body>
</html>
