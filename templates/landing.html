<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            color: #ffffff; 
            min-height: 100vh; 
        }
        
        /* Navigation moderne */
        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
            padding: 1rem 2rem;
        }
        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .language-selector {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 0.5rem 1rem;
            color: #f59e0b;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .language-selector:hover {
            background: #f59e0b;
            color: #0f0f1a;
            border-color: #f59e0b;
        }
        
        /* Hero section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 3rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        .main-title {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #f59e0b 50%, #ffedd5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }
        
        /* Badges */
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(63, 185, 80, 0.1);
            backdrop-filter: blur(8px);
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            margin-bottom: 2rem;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }
        .online-dot {
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Boutons principaux */
        .buttons-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 0.9rem 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 60px;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(245,158,11,0.25);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,158,11,0.35); }
        
        .btn-formation {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: white;
            padding: 0.9rem 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 60px;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(139,92,246,0.3);
        }
        .btn-formation:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,92,246,0.4); }
        
        /* Features rows */
        .features-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .feature-btn {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.3rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s;
            text-decoration: none;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .feature-btn:hover {
            transform: translateY(-2px);
            border-color: #f59e0b;
            background: rgba(245,158,11,0.1);
        }
        
        /* Cards */
        .cards-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            max-width: 750px;
            margin: 0 auto;
        }
        .card {
            flex: 1;
            min-width: 260px;
            max-width: 320px;
            background: rgba(15, 20, 30, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
            transition: all 0.25s;
        }
        .card:hover { 
            transform: translateY(-5px); 
            border-color: #f59e0b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card-header {
            background: rgba(22,27,34,0.7);
            padding: 0.8rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-weight: 600;
            color: #f59e0b;
            font-size: 0.85rem;
        }
        .card-body {
            padding: 1rem;
            text-align: center;
        }
        .card-body img {
            max-width: 100%;
            border-radius: 16px;
            max-height: 130px;
            object-fit: cover;
        }
        .update-time {
            font-size: 0.6rem;
            color: #8b949e;
            margin-top: 0.5rem;
        }
        .empty-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        /* Footer */
        footer {
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.7rem;
            text-align: center;
            padding: 1rem;
        }
        
        @media (max-width: 700px) {
            .main-title { font-size: 2.2rem; }
            .cards-row { flex-direction: column; align-items: center; }
            .card { max-width: 100%; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-container">
        <div class="logo">Rick Trading</div>
        <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
            <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
            <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
            <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
        </select>
    </div>
</nav>

<section class="hero">
    <div class="container">
        <h1 class="main-title" id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        
        <div class="online-badge">
            <span class="online-dot"></span>
            <span id="onlineCount" style="font-weight:600;">0</span>
            <span id="onlineLabel"></span>
        </div>
        
        <div class="buttons-group">
            <a href="/app" id="launchBtn" class="btn-primary"></a>
            <a href="/coming-soon" id="formationBtn" class="btn-formation"><span id="trainingFollowupTitle">Formation en trading avec suivi</span></a>
        </div>
        
        <div class="features-row">
            <a href="/coming-soon" class="feature-btn"><span id="feature1"></span></a>
            <a href="/coming-soon" class="feature-btn"><span id="feature2"></span></a>
            <a href="/formation" class="feature-btn"><span id="feature3"></span></a>
        </div>
        
        <div class="cards-row">
            <div class="card">
                <div class="card-header"><span id="marketPreview"></span></div>
                <div class="card-body">
                    <img id="chartPreview" src="" alt="Graphique">
                    <div class="update-time" id="chartUpdateTime"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><span id="partnerSpace"></span></div>
                <div class="card-body empty-card">
                    <div style="font-size:1.5rem;">⚡</div>
                    <div>À venir</div>
                </div>
            </div>
        </div>
        
        <footer><p id="footer"></p></footer>
    </div>
</section>

<script>
    const trainingFollowupTranslations = {
        fr: "Formation en trading avec suivi",
        en: "Trading training with follow-up",
        es: "Formación en trading con seguimiento",
        pt: "Formação em trading com acompanhamento",
        ru: "Обучение трейдингу с сопровождением",
        it: "Formazione sul trading con supporto",
        de: "Trading Ausbildung mit Betreuung",
        zh: "带跟进的交易培训",
        ja: "フォローアップ付きトレーニング"
    };

    function updatePage() {
        const lang = getCurrentLanguage();
        document.getElementById('title').textContent = t('title');
        document.getElementById('subtitle').textContent = t('subtitle');
        document.getElementById('launchBtn').innerHTML = t('launch');
        document.getElementById('feature1').textContent = t('feature1');
        document.getElementById('feature2').textContent = t('feature2');
        document.getElementById('feature3').innerHTML = t('feature3');
        document.getElementById('footer').innerHTML = t('footer');
        document.getElementById('marketPreview').textContent = t('market_preview');
        document.getElementById('partnerSpace').textContent = t('partner_space');
        document.getElementById('onlineLabel').textContent = t('online');
        document.getElementById('languageSelect').value = lang;
        
        // Traduction bouton formation
        const trainingEl = document.getElementById('trainingFollowupTitle');
        if (trainingEl && trainingFollowupTranslations[lang]) {
            trainingEl.textContent = trainingFollowupTranslations[lang];
        }
    }
    
    function changeLanguage() { 
        setLanguage(document.getElementById('languageSelect').value); 
    }
    
    async function updateOnlineCount() {
        try { 
            const res = await fetch('/api/online-display'); 
            const data = await res.json(); 
            document.getElementById('onlineCount').innerText = data.online; 
        } catch(e) {}
    }
    
    async function updateChartPreview() {
        try { 
            const res = await fetch('/api/chart-screenshot'); 
            const data = await res.json(); 
            const img = document.getElementById('chartPreview'); 
            if (img && data.image_url) { 
                img.src = data.image_url + '?t=' + new Date().getTime(); 
                document.getElementById('chartUpdateTime').innerHTML = '🕒 ' + data.updated_at; 
            } 
        } catch(e) {}
    }
    
    // Initialisation
    updatePage();
    updateOnlineCount();
    updateChartPreview();
    setInterval(updateOnlineCount, 35000);
    setInterval(updateChartPreview, 600000);
</script>
</body>
</html>
