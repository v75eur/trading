<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Trading - Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 500px;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .retry-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245,158,11,0.4);
        }
        .status {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #f85149;
        }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(245,158,11,0.2);
            border-top: 2px solid #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>Site en maintenance</h1>
        <p>Les données de marché (Deriv) sont temporairement indisponibles.<br>L'équipe technique travaille à rétablir la connexion.</p>
        <p style="font-size: 0.9rem;">Le chat et les autres fonctionnalités restent accessibles.</p>
        <button class="retry-btn" onclick="retryConnection()">🔄 Réessayer</button>
        <div id="retryStatus" class="status"></div>
    </div>

    <script>
        let retryCount = 0;
        async function retryConnection() {
            const btn = document.querySelector('.retry-btn');
            const statusDiv = document.getElementById('retryStatus');
            btn.disabled = true;
            btn.innerHTML = 'Connexion... <span class="loader"></span>';
            
            try {
                const res = await fetch('/api/ping');
                if (res.ok) {
                    statusDiv.innerHTML = '✅ Connexion rétablie ! Redirection...';
                    setTimeout(() => { window.location.href = '/app'; }, 1000);
                } else {
                    throw new Error('Pas de réponse');
                }
            } catch(e) {
                retryCount++;
                statusDiv.innerHTML = '❌ Toujours indisponible. Nouvelle tentative dans 5 secondes...';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = '🔄 Réessayer';
                    statusDiv.innerHTML = '';
                }, 5000);
            }
        }
    </script>
</body>
</html>
