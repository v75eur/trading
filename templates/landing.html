<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rick Trading - Accueil officiel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/translations.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
        }

        /* Image de fond */
        .hero-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.12;
            z-index: 0;
        }

        /* Conteneur principal - tout visible sans scroll */
        .main-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #fff, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(245,158,11,0.4);
        }

        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(8px);
            padding: 5px 16px;
            border-radius: 50px;
            margin-bottom: 1.5rem;
            border: 1px solid #3fb950;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 6px #3fb950;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        /* Grille des fonctionnalités - compacte */
        .features-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .feature-pill {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s;
        }

        .feature-pill:hover {
            transform: translateY(-2px);
            border-color: #f59e0b;
            background: rgba(245,158,11,0.1);
        }

        .feature-icon {
            font-size: 1rem;
            margin-right: 6px;
        }

        .feature-pill span {
            font-size: 0.85rem;
            font-weight: 500;
            color: #c9d1d9;
        }

        /* Deux cartes côte à côte - visibles immédiatement */
        .cards-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            max-width: 700px;
            margin: 0 auto;
        }

        .info-card {
            flex: 1;
            min-width: 240px;
            max-width: 280px;
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: all 0.3s;
        }

        .info-card:hover {
            transform: translateY(-4px);
            border-color: #f59e0b;
        }

        .card-header {
            background: rgba(22, 27, 34, 0.8);
            padding: 0.6rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-weight: 600;
            color: #f59e0b;
            font-size: 0.8rem;
        }

        .card-body {
            padding: 0.8rem;
            text-align: center;
        }

        .card-body img {
            max-width: 100%;
            border-radius: 14px;
            background: #0a0a0a;
            max-height: 140px;
            object-fit: cover;
        }

        .update-time {
            font-size: 0.6rem;
            color: #8b949e;
            margin-top: 0.4rem;
        }

        .empty-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            color: #8b949e;
            text-align: center;
            flex-direction: column;
            gap: 0.5rem;
        }

        .empty-card .emoji-big {
            font-size: 2rem;
        }

        .language-selector {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #f59e0b;
            border-radius: 30px;
            padding: 0.3rem 0.7rem;
            color: #f59e0b;
            cursor: pointer;
            z-index: 100;
            font-size: 0.75rem;
        }

        footer {
            margin-top: 1rem;
            color: #64748b;
            font-size: 0.65rem;
            text-align: center;
            padding: 0.5rem;
        }

        @media (max-width: 700px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 0.85rem; }
            .cards-row { flex-direction: column; align-items: center; }
            .info-card { max-width: 100%; }
            .feature-pill { padding: 0.4rem 1rem; }
        }
    </style>
</head>
<body>
    <img src="/static/rick.jpeg" alt="Rick Trading" class="hero-image">
    <select id="languageSelect" class="language-selector" onchange="changeLanguage()">
        <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
        <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
        <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
    </select>

    <div class="main-container">
        <h1 id="title"></h1>
        <p id="subtitle" class="subtitle"></p>
        
        <div class="online-badge">
            <span class="online-dot"></span>
            <span id="onlineCount" style="font-weight:bold;">0</span>
            <span id="onlineLabel"></span>
        </div>
        
        <a href="/app" id="launchBtn" class="btn-primary"></a>

        <div class="features-row">
            <div class="feature-pill"><span class="feature-icon">📈</span><span id="feature1"></span></div>
            <div class="feature-pill"><span class="feature-icon">🔔</span><span id="feature2"></span></div>
            <div class="feature-pill"><span class="feature-icon">💬</span><span id="feature3"></span></div>
        </div>

        <div class="cards-row">
            <div class="info-card">
                <div class="card-header"><span id="marketPreview"></span></div>
                <div class="card-body">
                    <img id="chartPreview" src="" alt="Graphique">
                    <div class="update-time" id="chartUpdateTime"></div>
                </div>
            </div>
            <div class="info-card">
                <div class="card-header"><span id="partnerSpace"></span></div>
                <div class="card-body empty-card">
                    <div class="emoji-big">⚡</div>
                    <div>À venir</div>
                </div>
            </div>
        </div>
        
        <footer><p id="footer"></p></footer>
    </div>

    <script>
        function updatePage() {
            document.getElementById('title').textContent = t('title');
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('launchBtn').innerHTML = t('launch');
            document.getElementById('feature1').textContent = t('feature1');
            document.getElementById('feature2').textContent = t('feature2');
            document.getElementById('feature3').textContent = t('feature3');
            document.getElementById('footer').innerHTML = t('footer');
            document.getElementById('marketPreview').textContent = t('market_preview');
            document.getElementById('partnerSpace').textContent = t('partner_space');
            document.getElementById('onlineLabel').textContent = t('online');
            document.getElementById('languageSelect').value = getCurrentLanguage();
        }
        function changeLanguage() { setLanguage(document.getElementById('languageSelect').value); }
        async function updateOnlineCount() {
            try { const res = await fetch('/api/online-display'); const data = await res.json(); document.getElementById('onlineCount').innerText = data.online; } catch(e) {}
        }
        async function updateChartPreview() {
            try { const res = await fetch('/api/chart-screenshot'); const data = await res.json(); const img = document.getElementById('chartPreview'); if (img && data.image_url) { img.src = data.image_url + '?t=' + new Date().getTime(); document.getElementById('chartUpdateTime').innerHTML = '🕒 ' + data.updated_at; } } catch(e) {}
        }
        updatePage(); updateOnlineCount(); updateChartPreview();
        setInterval(updateOnlineCount, 35000);
        setInterval(updateChartPreview, 600000);
    </script>
</body>
</html>
