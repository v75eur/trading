<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rick Trading - Plateforme</title>
<script src="/static/translations.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.app-header {
    background: #161b22;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #30363d;
    flex-wrap: wrap;
    gap: 10px;
}
.logo { font-size: 1.3rem; font-weight: 600; color: #58a6ff; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls select, .controls button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
}
.price-live { font-weight: bold; color: #3fb950; min-width: 90px; }
.right-header { display: flex; align-items: center; gap: 15px; }
.online-indicator {
    display: flex; align-items: center; gap: 6px; background: #1e293b;
    padding: 4px 12px; border-radius: 30px; font-size: 0.85rem;
}
.online-dot { width: 8px; height: 8px; background: #3fb950; border-radius: 50%; box-shadow: 0 0 4px #3fb950; }
.lang-select {
    background: #21262d; color: #f59e0b; border: 1px solid #f59e0b;
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
.main-layout { display: flex; flex: 1; overflow: hidden; }
.chart-area { flex: 1; display: flex; flex-direction: column; }
#chart { width: 100%; flex: 1; background: #0d1117; }
.chart-info {
    background: #161b22; padding: 6px 15px; display: flex; gap: 20px;
    font-size: 0.75rem; border-top: 1px solid #30363d; flex-wrap: wrap;
}
.chart-info span { background: #0d1117; padding: 3px 10px; border-radius: 20px; }
.chat-panel {
    width: 320px; background: #161b22; border-left: 1px solid #30363d;
    display: flex; flex-direction: column;
}
.chat-header {
    background: #21262d; padding: 10px; text-align: center; font-weight: bold;
    color: #58a6ff; border-bottom: 1px solid #30363d;
    display: flex; justify-content: space-between;
}
.chat-messages { flex: 1; overflow-y: auto; padding: 10px; }
.chat-msg { background: #0d1117; padding: 6px 10px; margin: 5px 0; border-radius: 10px; font-size: 0.85rem; }
.chat-user { font-weight: bold; margin-right: 6px; }
.chat-time { color: #666; font-size: 0.7rem; margin-left: 6px; }
.chat-input-area { padding: 10px; border-top: 1px solid #30363d; }
.chat-input-area input {
    width: 100%; background: #0d1117; border: 1px solid #30363d;
    padding: 8px; border-radius: 25px; color: white; margin-bottom: 6px;
}
.chat-input-area button {
    width: 100%; background: #58a6ff; color: #0d1117; border: none;
    padding: 6px; border-radius: 25px; font-weight: bold; cursor: pointer;
}
.emoji-bar { display: flex; gap: 5px; margin-bottom: 6px; justify-content: center; }
.emoji-bar button {
    background: #21262d; border: none; font-size: 1.1rem;
    padding: 3px 6px; border-radius: 8px; cursor: pointer; width: auto;
}
.like-container {
    position: fixed; bottom: 20px; right: 340px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(22,27,34,0.9); padding: 5px 10px;
    border-radius: 50px; backdrop-filter: blur(4px); z-index: 100;
}
.like-btn {
    background: #f85149; border: none; color: white; font-size: 1.1rem;
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
}
.loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
.ws-error, .token-warning {
    position: fixed; top: 0; left: 0; width: 100%; text-align: center;
    padding: 6px; z-index: 10000; font-size: 0.8rem;
}
.ws-error { background: #f85149; color: white; display: none; }
.token-warning {
    background: #d29922; color: black; display: none; top: 40px;
    width: auto; right: 20px; left: auto; border-radius: 30px;
}
#adminTrigger {
    position: fixed; bottom: 15px; left: 15px; width: 32px; height: 32px;
    background: #21262d; border: 1px solid #30363d; border-radius: 50%;
    color: #8b949e; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1rem; z-index: 200;
}
/* MODALS */
.modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); z-index: 10001;
    display: none; justify-content: center; align-items: center;
}
.modal-content {
    background: #1a1a2e; border: 1px solid #f59e0b; border-radius: 16px;
    padding: 25px; width: 320px; text-align: center; position: relative;
}
.modal-content input {
    width: 100%; padding: 8px; margin: 10px 0;
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    color: white;
}
.modal-content button {
    background: #f59e0b; border: none; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-weight: bold;
}
.close-modal {
    position: absolute; top: 10px; right: 15px;
    font-size: 20px; cursor: pointer; color: #8b949e;
}
.close-modal:hover { color: white; }
.pseudo-box { background: #1a1a2e; border: 2px solid #58a6ff; border-radius: 20px; padding: 25px; width: 320px; text-align: center; position: relative; }
.pseudo-box input { width: 100%; padding: 10px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: white; }
.pseudo-box button { background: linear-gradient(135deg,#58a6ff,#3fb950); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
@media (max-width: 700px) { .chat-panel { width: 280px; } .like-container { right: 300px; } }
</style>
</head>
<body>

<div id="wsError" class="ws-error">⚠️ Connexion données temporairement indisponible</div>
<div id="tokenWarning" class="token-warning">🔐 Token GitHub expire bientôt</div>

<div class="app-header">
    <div class="logo" id="appTitle"></div>
    <div class="controls">
        <select id="sym"><option value="R_75">Volatility 75</option><option value="frxEURUSD">EUR/USD</option><option value="frxXAUUSD">XAU/USD</option></select>
        <select id="tf"><option value="5">M5</option><option value="15">M15</option><option value="60">H1</option><option value="240">H4</option></select>
        <span class="price-live" id="price">---</span>
        <button onclick="zoomIn()">+</button><button onclick="zoomOut()">-</button><button onclick="resetZoom()">↺</button>
    </div>
    <div class="right-header">
        <div class="online-indicator"><span class="online-dot"></span><span id="onlineCount">0</span><span id="onlineLabel"></span></div>
        <select id="langSelect" class="lang-select" onchange="changeAppLanguage(this.value)">
            <option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option>
            <option value="pt">🇵🇹 PT</option><option value="ru">🇷🇺 RU</option><option value="it">🇮🇹 IT</option>
            <option value="de">🇩🇪 DE</option><option value="zh">🇨🇳 中文</option><option value="ja">🇯🇵 JP</option>
        </select>
    </div>
</div>

<div class="main-layout">
    <div class="chart-area">
        <canvas id="chart"></canvas>
        <div class="chart-info">
            <span id="canalInfo"><span id="canalLabel"></span>: --</span>
            <span id="srInfo"><span id="srLabel"></span>: --</span>
            <span id="signalInfo"><span id="signalsLabel"></span>: --</span>
            <span id="statsInfo"><span id="statsLabel"></span>: --</span>
        </div>
    </div>
    <div class="chat-panel">
        <div class="chat-header"><span id="chatTitle"></span><div><button onclick="shareTwitter()">𝕏</button><button onclick="shareTelegram()">📱</button></div></div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <div class="emoji-bar"><button onclick="addEmoji('🚀')">🚀</button><button onclick="addEmoji('📈')">📈</button><button onclick="addEmoji('📉')">📉</button><button onclick="addEmoji('💰')">💰</button><button onclick="addEmoji('🔥')">🔥</button></div>
            <input type="text" id="chatInput" placeholder="" onkeypress="if(event.key==='Enter')sendChat()" onclick="openPseudo()">
            <button id="sendBtn" onclick="sendChat()"></button>
        </div>
    </div>
</div>

<div class="like-container"><span id="likeCount">112</span><button class="like-btn" onclick="addLike()">❤️</button></div>
<div id="loader" class="loader"><div class="spinner"></div></div>

<!-- Admin gear -->
<div id="adminTrigger" onclick="openAdminModal()">⚙</div>

<!-- Admin Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeAdminModal()">&times;</span>
        <h3>⚙️ Administration</h3>
        <input type="password" id="adminPass" placeholder="Mot de passe">
        <button onclick="checkAdmin()">Accéder</button>
        <p id="adminError" style="color:#f85149; display:none;">Mot de passe incorrect</p>
    </div>
</div>

<!-- Stats Modal (admin uniquement) -->
<div id="statsModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeStatsModal()">&times;</span>
        <h3>📊 Statistiques</h3>
        <div id="statsContent"></div>
    </div>
</div>

<script>
let USERNAME = "";
let ADMIN_HASH = "d0695d2f4b6487fb81c7047ba01d06d5065aa1a9f18f89633389e1e9b5d85fd6";
let isAdmin = false;

function updateAppLanguage() {
    const lang = getCurrentLanguage();
    const t = translations[lang];
    if (t) {
        document.getElementById('appTitle').innerHTML = t.app_title;
        document.getElementById('canalLabel').innerHTML = t.canal;
        document.getElementById('srLabel').innerHTML = t.sr;
        document.getElementById('signalsLabel').innerHTML = t.signals;
        document.getElementById('statsLabel').innerHTML = t.stats;
        document.getElementById('chatTitle').innerHTML = t.chat_title;
        document.getElementById('chatInput').placeholder = t.chat_placeholder;
        document.getElementById('sendBtn').innerHTML = t.chat_send;
        document.getElementById('onlineLabel').innerHTML = t.online;
    }
    document.getElementById('langSelect').value = getCurrentLanguage();
}
function changeAppLanguage(lang) { setLanguage(lang); }

async function updateOnline() {
    try {
        const res = await fetch('/api/online-display');
        const data = await res.json();
        document.getElementById('onlineCount').innerText = data.online;
    } catch(e) {}
}
function addEmoji(e) { document.getElementById('chatInput').value += e; document.getElementById('chatInput').focus(); }
function shareTwitter() { window.open('https://twitter.com/intent/tweet?text=📊 Rejoignez-moi sur Rick Trading !&url='+encodeURIComponent(location.href), '_blank'); }
function shareTelegram() { window.open('https://t.me/share/url?url='+encodeURIComponent(location.href), '_blank'); }

async function loadChat() {
    try {
        const res = await fetch('/api/chat');
        const msgs = await res.json();
        const container = document.getElementById('chatMessages');
        container.innerHTML = msgs.map(m => `<div class="chat-msg"><span class="chat-user">${escapeHtml(m.user)}</span> ${escapeHtml(m.message)}<span class="chat-time">${m.time}</span></div>`).join('');
        container.scrollTop = container.scrollHeight;
    } catch(e) {}
}
async function sendChat() {
    if (!USERNAME) { openPseudo(); return; }
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;
    await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg, user: USERNAME }) });
    input.value = '';
    loadChat();
}
function openPseudo() {
    if (USERNAME) return;
    const modal = document.getElementById('pseudoModal');
    if (modal) modal.style.display = 'flex';
}
function closePseudoModal() {
    document.getElementById('pseudoModal').style.display = 'none';
}
function setPseudo() {
    const name = document.getElementById('pseudoInput').value.trim();
    if (name.length < 2) return;
    USERNAME = name;
    fetch('/api/pseudo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pseudo: USERNAME }) });
    closePseudoModal();
}
async function addLike() {
    try {
        const res = await fetch('/api/like', { method: 'POST' });
        const data = await res.json();
        document.getElementById('likeCount').innerText = data.likes;
    } catch(e) {}
}
function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

// Admin modals
function openAdminModal() {
    document.getElementById('adminModal').style.display = 'flex';
    document.getElementById('adminPass').value = '';
    document.getElementById('adminError').style.display = 'none';
}
function closeAdminModal() {
    document.getElementById('adminModal').style.display = 'none';
}
function closeStatsModal() {
    document.getElementById('statsModal').style.display = 'none';
}
async function checkAdmin() {
    const pass = document.getElementById('adminPass').value;
    const encoder = new TextEncoder();
    const hash = await crypto.subtle.digest('SHA-256', encoder.encode(pass));
    const hashHex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    if (hashHex === ADMIN_HASH) {
        isAdmin = true;
        closeAdminModal();
        await loadStatsModal();
        document.getElementById('statsModal').style.display = 'flex';
    } else {
        document.getElementById('adminError').style.display = 'block';
    }
}
async function loadStatsModal() {
    try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('statsContent').innerHTML = `
            <p>👥 En ligne: ${data.online}</p>
            <p>❤️ Likes: ${data.likes}</p>
            <p>📊 Visiteurs: ${data.visitors}</p>
        `;
    } catch(e) {
        document.getElementById('statsContent').innerHTML = '<p>Erreur chargement stats</p>';
    }
}

// Pseudo modal (HTML manquant, on l'ajoute)
const pseudoModalHtml = `
<div id="pseudoModal" class="modal">
    <div class="pseudo-box">
        <span class="close-modal" onclick="closePseudoModal()">&times;</span>
        <h3 id="welcomeTitle">👋 Bienvenue !</h3>
        <p id="pseudoText">Choisissez un pseudo pour chatter</p>
        <input type="text" id="pseudoInput" maxlength="20" placeholder="Pseudo">
        <button id="joinBtn" onclick="setPseudo()">Rejoindre le chat</button>
    </div>
</div>`;
document.body.insertAdjacentHTML('beforeend', pseudoModalHtml);

updateOnline(); setInterval(updateOnline, 35000);
loadChat(); setInterval(loadChat, 4000);
updateAppLanguage();
</script>
<script src="/static/chart.js"></script>
</body>
</html>
